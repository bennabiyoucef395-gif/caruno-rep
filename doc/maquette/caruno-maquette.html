<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARUNO — Maquette magasin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F1;--surface:#FFFFFF;--soft:#FAFAF8;--ink:#17191E;--muted:#4B5060;--line:#DADBD6;--line2:#ECECE8;
  --dark:#17191E;--dark2:#23262E;--dark-ink:#E4E5EA;
  --accent:#C2410C;--accent-hover:#9A3412;--accent-weak:#FBEADF;--accent-ink:#7C2D12;
  --ok:#14532D;--ok-bg:#E9F6EE;--warn:#9A3412;--warn-bg:#FFF4E5;--bad:#991B1B;--bad-bg:#FDECEC;--info:#1E3A8A;--info-bg:#E8EEFC;
  --mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1D4ED8;outline-offset:2px}
h1{font-size:26px;margin:0;line-height:1.2}h2{font-size:17px;margin:0}h3{font-size:15px;margin:0}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.right{text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.ribbon{background:#FFF4E5;color:#5C2A06;font-size:13px;padding:6px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #F1C48B}
.ribbon button{background:none;border:0;text-decoration:underline;cursor:pointer;color:#5C2A06;padding:4px}
.shell{display:flex;min-height:calc(100vh - 31px)}
.side{width:236px;flex:none;background:var(--dark);color:#fff;display:flex;flex-direction:column;padding:16px 12px;gap:4px;position:sticky;top:0;height:calc(100vh - 31px);overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:4px 10px 18px}
.brand b{font-size:21px;letter-spacing:.09em}.brand span{font-size:12px;color:#C9CBD2}
.nav a{display:flex;align-items:center;gap:12px;color:var(--dark-ink);text-decoration:none;padding:0 12px;min-height:44px;border-radius:9px;font-size:15px}
.nav a:hover{background:var(--dark2);color:#fff}
.nav a[aria-current="page"]{background:var(--accent);color:#fff;font-weight:600}
.nav svg{flex:none}
.side .me{margin-top:auto;border-top:1px solid #33363F;padding:12px 10px 0;display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.avatar{width:36px;height:36px;border-radius:50%;background:#3A3E48;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.content{width:100%;max-width:1480px;margin:0 auto;padding:22px;display:flex;flex-direction:column;gap:18px}
.bottomnav{display:none}
.drawer-bg{display:none}
@media (max-width:900px){
  .side{display:none}
  .side.open{display:flex;position:fixed;z-index:40;left:0;top:0;height:100vh}
  .drawer-bg.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:39}
  .topbar{display:flex;align-items:center;gap:10px;background:var(--dark);color:#fff;padding:8px 12px;position:sticky;top:0;z-index:20}
  .topbar b{letter-spacing:.08em;font-size:18px}
  .topbar .icon-btn{background:var(--dark2);color:#fff;border:0}
  .content{padding:14px 14px 96px}
  .bottomnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:20;padding:4px 4px 10px}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;font-size:11px;color:var(--muted);text-decoration:none}
  .bottomnav a[aria-current="page"]{color:var(--accent);font-weight:700}
  h1{font-size:22px}
}

/* components */
.page-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.page-head .sub{font-size:14px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#B9BAB3;color:var(--ink)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff}
.btn-dark{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:600}
.btn-dark:hover{background:#000;color:#fff}
.btn-outline{border-color:var(--ink);font-weight:600}
.btn-lg{min-height:54px;font-size:17px;font-weight:700;border-radius:12px}
.btn:disabled{background:#E4E4DF;border-color:#E4E4DF;color:var(--muted);cursor:not-allowed}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.card-pad{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;align-items:start}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-info{background:var(--info-bg);color:var(--info)}.b-grey{background:#ECECE8;color:#3D414C}.b-accent{background:var(--accent-weak);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #CFD0CA;background:#fff;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{min-height:46px;padding:0 14px;border:0;background:none;cursor:pointer;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 280px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #CFD0CA;border-radius:10px;padding:0 12px;min-height:46px}
.search input{border:0;outline:none;flex:1 1 auto;min-width:0;background:transparent;font-size:15px;height:44px}
.search.big{border:2px solid var(--ink);min-height:56px;border-radius:12px}
.search.big input{font-size:17px}
select,.input,textarea{min-height:44px;border:1px solid #CFD0CA;border-radius:10px;background:#fff;padding:0 12px;font-size:15px}
textarea{padding:10px 12px;min-height:88px;resize:vertical}
.input.num{text-align:right}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:600;color:#3D414C}
.field .hint{font-size:12px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 16px}
.form-section{display:flex;flex-direction:column;gap:12px}
.form-section h2{padding-bottom:8px;border-bottom:1px solid var(--line2)}
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#FBFBF9}
table.t td a.rowlink{color:var(--ink);text-decoration:none;font-weight:600}
table.t td a.rowlink:hover{text-decoration:underline}
.thumb{width:44px;height:44px;border-radius:8px;background:#EEEEEA;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.cellpart{display:flex;align-items:center;gap:12px}
.cellpart .t1{font-weight:600}.cellpart .t2{font-size:13px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.kpi{display:flex;flex-direction:column;gap:6px;padding:16px 18px}
.kpi .v{font-size:28px;font-weight:700;line-height:1.1}
.kpi .l{font-size:14px;color:var(--muted)}.kpi .s{font-size:13px;color:var(--muted)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:14px}
.alert svg{flex:none;margin-top:1px}
.a-warn{background:var(--warn-bg);color:#5C2A06}.a-info{background:var(--info-bg);color:var(--info)}.a-ok{background:var(--ok-bg);color:var(--ok)}.a-bad{background:var(--bad-bg);color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.meter{height:12px;border-radius:999px;background:#ECECE8;overflow:hidden}.meter>div{height:100%;border-radius:999px}
.qty{display:inline-flex;align-items:center;border:1px solid #CFD0CA;border-radius:10px;background:#fff}
.qty button{width:42px;height:42px;border:0;background:none;font-size:20px;cursor:pointer}
.qty span{min-width:26px;text-align:center;font-weight:600}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.photo{position:relative;aspect-ratio:1;border-radius:10px;background:#EEEEEA;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);text-align:center;border:2px solid transparent}
.photo.main{border-color:var(--accent)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .tag{position:absolute;left:4px;top:4px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px}
.photo .ops{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(23,25,30,.75)}
.photo .ops button{flex:1;border:0;background:none;color:#fff;font-size:11px;min-height:28px;cursor:pointer}
.photo-add{border:2px dashed #8A8F9C;background:#fff;cursor:pointer;color:var(--ink);font-weight:600;flex-direction:column;gap:4px}
.photo-add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.big-photo{aspect-ratio:4/3;border-radius:12px;background:#EEEEEA;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--muted);overflow:hidden}
.big-photo img{width:100%;height:100%;object-fit:contain;background:#fff}
.bars{height:58px;background:repeating-linear-gradient(90deg,#000 0 2px,#fff 2px 4px,#000 4px 5px,#fff 5px 8px,#000 8px 11px,#fff 11px 12px)}
.label-prev{width:300px;max-width:100%;border:1px dashed #8A8F9C;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:60;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;max-width:min(560px,calc(100vw - 32px));box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (max-width:900px){.toast{bottom:84px}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.cam{position:relative;border-radius:18px;background:#2B2F38;min-height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cam .frame{width:min(280px,80%);height:140px;border:3px solid #fff;border-radius:14px;display:flex;align-items:center;justify-content:center}
.cam .beam{width:88%;height:3px;border-radius:2px;background:var(--accent)}
.cam .beam.ok{background:#22C55E}
.cam .hint{position:absolute;top:12px;left:0;right:0;text-align:center;color:#E4E5EA;font-size:14px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--dark)}
.login .box{width:min(440px,100%);display:flex;flex-direction:column;gap:22px;color:#fff}
.login .acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.login .acc button{min-height:56px;border-radius:12px;border:1px solid #4A4E59;background:var(--dark2);color:#fff;text-align:left;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.login .acc button[aria-pressed="true"]{border:2px solid var(--accent);background:#2E1E16}
.login .acc small{color:#C9CBD2;font-size:12px}
.login input{background:var(--dark2);border-color:#4A4E59;color:#fff}
.login label{color:var(--dark-ink)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.pay-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:8px;align-items:center}
.demo{border:1px dashed #F1C48B;background:#FFFBF5;border-radius:10px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:#5C2A06}
.demo select{min-height:36px;font-size:13px;flex:1 1 180px}
.steps .skip{color:var(--muted)}
.modal.wide{width:min(820px,100%)}
.print-area{background:#fff;color:#000;border:1px solid var(--line);border-radius:8px;padding:20px;font-size:13px;display:flex;flex-direction:column;gap:12px}
.print-area.ticket{width:300px;max-width:100%;margin:0 auto;font-family:var(--mono);font-size:12px;padding:14px;gap:8px}
.print-area table{width:100%;border-collapse:collapse}
.print-area th,.print-area td{padding:4px 6px;border-bottom:1px solid #DDD;text-align:left;vertical-align:top}
.print-area .r{text-align:right;white-space:nowrap}
.print-area .ids{font-size:11px;color:#333}
@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;left:0;top:0;width:100%;border:0}
  .print-area.ticket{width:72mm}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================================================================
   CARUNO — maquette autonome du front magasin de pièces auto.
   Données de test fictives, gardées dans le navigateur (localStorage).
   Rien n'est envoyé à Dolibarr.
   =================================================================== */
'use strict';
const KEY = 'caruno-maquette-v2';
const TODAY = '2026-11-01';
const DEVICE = 'Comptoir 1'; // ce poste : les ventes de son journal lui appartiennent
const LEVELS = ['Public', 'Garage', 'Revendeur'];
const CAT_LEVEL = { Particulier: 0, Garage: 1, Revendeur: 2 };
const FAMILIES = ['Moteur', 'Filtration', 'Freinage', 'Embrayage et transmission', 'Suspension et direction', 'Électricité et électronique', 'Refroidissement et climatisation', 'Carrosserie et accessoires'];
const WAREHOUSES = ['Magasin', 'Réserve'];
const ROLES = { vendeur: 'Vendeur', magasinier: 'Magasinier', comptable: 'Comptable', responsable: 'Responsable', gerant: 'Gérant' };
const SEE_COST = ['gerant', 'responsable', 'comptable'];
const EDIT_PARTS = ['magasinier', 'responsable', 'gerant'];
const BELOW_FLOOR = ['gerant'];
const OVER_LIMIT = ['gerant'];
const MODES = { especes: 'Espèces', cheque: 'Chèque', virement: 'Virement', avoir: 'Avoir client', credit: 'À crédit' };
const STOCK_MODES = { bill: 'sortie à la validation de la facture', shipment: 'sortie à la validation de l’expédition' };
const STEP_LABEL = { validation: 'validation de la facture', paiement: 'encaissement' };

/* ---------- icons ---------- */
const P = {
  caisse: '<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/>',
  pieces: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/>',
  stock: '<path d="M3 21V8l9-5 9 5v13"/><path d="M7 21v-8h10v8"/><path d="M7 17h10"/>',
  clients: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14a6.5 6.5 0 0 1 3.5 6"/>',
  ventes: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/>',
  achats: '<path d="M1 4h13v12H1z"/><path d="M14 9h4l4 4v3h-8"/><circle cx="5.5" cy="18.5" r="2"/><circle cx="17.5" cy="18.5" r="2"/>',
  scanner: '<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8"/><path d="M10 8v8"/><path d="M13 8v8"/><path d="M17 8v8"/>',
  tableau: '<path d="M3 3v18h18"/><path d="M7 15v3"/><path d="M11 11v7"/><path d="M15 7v11"/><path d="M19 12v6"/>',
  utilisateurs: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  warn: '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M11 12h1v5h1"/>',
  menu: '<path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
  more: '<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
  reglements: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01"/><path d="M18 12h.01"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  print: '<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/>'
};
function ic(name, size, color) {
  return '<svg aria-hidden="true" width="' + (size || 20) + '" height="' + (size || 20) + '" viewBox="0 0 24 24" fill="none" stroke="' + (color || 'currentColor') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + P[name] + '</svg>';
}

/* ---------- seed data ---------- */
function seed() {

function newSale() { return { ref: nextRef('V'), q: '', fam: 'Tous', client: 'c', lines: [], remise: 0, mode: 'especes', given: '', split: {}, cut: '', done: null, cutOff: null }; }
function caisseState() {
  if (!S.ui.caisse) S.ui.caisse = Object.assign(newSale(), { q: '03L115562', lines: [{ pid: 1, qty: 1 }, { pid: 4, qty: 1 }], given: '12000' });
  return S.ui.caisse;
}
function caisseTotals(st) {
  const c = client(st.client), L = lvl(c), cr = c.remise || 0;
  const lines = st.lines.map((l) => { const p = part(l.pid); const unit = Math.round(p.prices[L] * (1 - cr / 100) * (1 - st.remise / 100)); return { l, p, unit, sum: unit * l.qty, below: unit < p.floor }; });
  const T = totals(lines.map((x) => ({ pid: x.p.id, qty: x.l.qty, price: x.unit })));
  return Object.assign(T, { c, L, cr, lines, cost: lines.reduce((t, x) => t + x.p.cost * x.l.qty, 0), below: lines.some((x) => x.below) });
}
// Répartition du paiement : règlements (espèces, chèque, virement, avoir) et part à crédit.
function payPlan(st, T) {
  const amt = (k) => parseInt(String(st.split[k] || '').replace(/\D/g, ''), 10) || 0;
  let pay, credit = 0;
  if (st.mode === 'mixte') { pay = ['especes', 'cheque', 'virement', 'avoir'].map((k) => ({ mode: k, amount: amt(k) })).filter((p) => p.amount > 0); credit = amt('credit'); }
  else if (st.mode === 'credit') { pay = []; credit = T.ttc; }
  else pay = [{ mode: st.mode, amount: T.ttc }];
  const sum = pay.reduce((t, p) => t + p.amount, 0) + credit;
  const avoir = (pay.find((p) => p.mode === 'avoir') || {}).amount || 0;
  const cc = creditCheck(st.client, credit);
  let msg = '';
  if (!st.lines.length) msg = 'Panier vide.';
  else if (sum !== T.ttc) msg = (sum < T.ttc ? 'Reste à répartir : ' + fmt(T.ttc - sum) : 'Trop réparti de ' + fmt(sum - T.ttc)) + '.';
  else if (avoir > creditOf(st.client)) msg = 'Avoir disponible insuffisant (' + fmt(creditOf(st.client)) + ').';
  else if (cc.block) msg = cc.msg;
  return { pay, credit, sum, ok: !msg, msg, warn: cc.block ? '' : cc.msg };
}

      '<div class="demo"><label for="caisse-cut">Démo coupure réseau</label><select id="caisse-cut" data-change="caisseCut">' + [['', 'Aucune'], ['create', 'Avant la validation de la facture'], ['validate', 'Réponse de la validation perdue'], ['pay', 'Réponse du paiement perdue']].map((o) => '<option value="' + o[0] + '"' + (st.cut === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div>' +

/* =================================================================== STOCK */
function viewStock() {
  const tab = S.ui.stockTab || 'alertes';
  const alerts = S.db.parts.filter((p) => total(p) < p.seuil);
  let body = '';
  if (tab === 'alertes') {
    body = '<div class="card" style="overflow:hidden"><div class="card-head"><h2>' + alerts.length + ' pièces sous le seuil</h2>' + (can(['magasinier', 'responsable', 'gerant']) ? '<button class="btn btn-primary" type="button" data-action="prepareOrders">Préparer les commandes fournisseurs</button>' : '') + '</div>' +
      '<div class="table-wrap"><table class="t" style="min-width:820px"><thead><tr><th>Pièce</th><th>Réf.</th><th class="right">Stock</th><th class="right">Seuil</th><th class="right">À commander</th><th>Fournisseur</th></tr></thead><tbody>' +
      alerts.map((p) => '<tr class="click" data-action="go" data-arg="#/pieces/' + p.id + '"><td><div class="cellpart">' + thumb(p, 36) + '<div><a class="rowlink" href="#/pieces/' + p.id + '">' + esc(p.name) + '</a><div class="t2">' + esc(p.brand) + '</div></div></div></td><td class="mono">' + esc(p.ref) + '</td>' +
        '<td class="right num" style="font-weight:700;color:' + (total(p) ? 'var(--warn)' : 'var(--bad)') + '">' + total(p) + '</td><td class="right num muted">' + p.seuil + '</td><td class="right num"><b>' + Math.max(p.souhaite - total(p), 0) + '</b></td><td>' + esc(supplier(p.sups[0].sid).name) + (seeCost() ? ' · ' + fmt(p.sups[0].price) : '') + '</td></tr>').join('') +
      '</tbody></table></div></div>';
  } else if (tab === 'mouvements') {

      '<div class="actions"><a class="btn btn-outline" href="#/pieces/' + p.id + '" style="flex:1">Fiche et photos</a>' + (can(['vendeur', 'responsable', 'gerant']) ? '<button class="btn btn-primary" type="button" data-action="caisseAddGo" data-arg="' + p.id + '" style="flex:1">Vendre</button>' : '<button class="btn" type="button" data-action="modalTransfer" data-arg="' + p.id + '" style="flex:1">Transférer</button>') + '</div>';
    if (sc.mode === 'count') { const n = sc.count === '' ? p.stock[wh] : Number(sc.count); const gap = n - p.stock[wh];
      card += '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="muted" style="font-size:14px">Compté en <b style="color:var(--ink)">' + wh + ' · <span class="mono">' + esc(p.loc[wh]) + '</span></b><br>Attendu : ' + p.stock[wh] + '</span><div class="qty"><button type="button" data-action="scanCount" data-arg="-1" aria-label="Moins un">−</button><span class="num" style="font-size:20px">' + n + '</span><button type="button" data-action="scanCount" data-arg="1" aria-label="Plus un">+</button></div></div>' +
        '<b style="color:' + (gap ? 'var(--warn)' : 'var(--ok)') + ';font-size:14px">' + (gap ? 'Écart ' + (gap > 0 ? '+' : '−') + Math.abs(gap) + ' : une correction sera créée' : 'Conforme') + '</b><button class="btn btn-primary btn-lg" type="button" data-action="scanSaveCount">Enregistrer le comptage</button>'; }
    if (sc.mode === 'reception') { const line = target && target.lines.find((l) => l.pid === p.id);
      card += line ? '<div class="alert a-ok">' + ic('check', 18) + 'Ligne cochée sur ' + target.ref + ' : ' + line.rec + ' / ' + line.qty + ' reçues</div><a class="btn btn-dark btn-lg" href="#/achats/' + target.ref + '">Voir la réception</a>' : '<div class="alert a-warn">' + ic('warn', 18, '#9A3412') + 'Pièce absente de la commande ' + (target ? target.ref : '') + '.</div>'; }
    card += '</section>';
  }
  const ctl = sc.mode === 'count' ? '<div class="toolbar"><label for="sc-wh" class="muted">Entrepôt compté</label><select id="sc-wh" data-change="scanWh">' + WAREHOUSES.map((w) => '<option' + (w === wh ? ' selected' : '') + '>' + w + '</option>').join('') + '</select></div>'
    : sc.mode === 'reception' ? (openPOs.length ? '<div class="toolbar"><label for="sc-po" class="muted">Commande reçue</label><select id="sc-po" data-change="scanPo" style="flex:1">' + openPOs.map((o) => '<option value="' + o.ref + '"' + (o === target ? ' selected' : '') + '>' + o.ref + ' · ' + esc(supplier(o.supplier).name) + '</option>').join('') + '</select></div>' : '<div class="alert a-info">' + ic('info', 18) + 'Aucune commande fournisseur en attente de réception.</div>') : '';
  return head('Scanner', 'Caméra du téléphone ou douchette USB') +
    '<div style="max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px">' +
    '<div class="chips" role="group" aria-label="Mode">' + [['consult', 'Consulter'], ['count', 'Inventaire'], ['reception', 'Réception']].map((m) => '<button class="chip" type="button" data-action="scanMode" data-arg="' + m[0] + '" aria-pressed="' + (sc.mode === m[0]) + '">' + m[1] + '</button>').join('') + '</div>' + ctl +
    '<div class="cam"><span class="hint">' + (p ? 'Code lu : ' + esc(p.ean) : 'Placez le code-barres dans le cadre') + '</span><div class="frame"><div class="beam' + (p ? ' ok' : '') + '"></div></div><button class="btn" type="button" data-action="scanSim" style="position:absolute;bottom:14px;border-radius:999px">Simuler un scan</button></div>' +
    '<label class="search" for="scan-code">' + ic('scanner', 20, '#4B5060') + '<span class="sr">Code-barres</span><input id="scan-code" inputmode="numeric" placeholder="Saisir ou scanner un code, puis Entrée" value="' + esc(sc.code) + '" data-input="scanCode" data-enter="scanEnter"></label>' +
    card + '</div>';
}

/* =================================================================== TABLEAU DE BORD */
function viewTableau() {
  const day = S.db.day, mo = S.db.months;
  const ca = day.base + (day.extra || 0);
  const imp = S.db.clients.reduce((t, c) => t + encours(c.id), 0);
  const lateClients = S.db.clients.filter((c) => S.db.docs.some((d) => d.client === c.id && d.type === 'facture' && d.status !== 'payee' && d.due && d.due < TODAY)).length;
  const alerts = S.db.parts.filter((p) => total(p) < p.seuil);
  const chq = payments().filter((p) => p.mode === 'cheque' && p.amount > 0 && !p.deposited);
  const sellers = Object.keys(day.sellers).map((k) => ({ u: S.db.users.find((x) => x.login === k), v: day.sellers[k] })).sort((a, b) => b.v[0] - a.v[0]);
  const max = Math.max.apply(null, sellers.map((s) => s.v[0]));
  const tile = (l, v, s) => '<div class="card kpi"><span class="l">' + l + '</span><span class="v num">' + v + '</span><span class="s">' + s + '</span></div>';
  const oct = mo['2026-10'], sep = mo['2026-09'];
  const growth = Math.round((oct.ttc - sep.ttc) / sep.ttc * 100);
  const octHt = oct.ttc / 1.19, margin = ((octHt - oct.cost) / octHt * 100).toFixed(1).replace('.', ',');
  const out = cashOut();
  return head('Tableau de bord', 'Dimanche 1<sup>er</sup> novembre 2026 · montants TTC') +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">' +
      tile('Chiffre d’affaires du jour', fmt(ca), day.count + ' ventes · panier moyen ' + fmt(ca / day.count)) +
      tile('Octobre 2026', fmt(oct.ttc), (growth >= 0 ? '+' : '−') + Math.abs(growth) + ' % par rapport à septembre') +
      (seeCost() ? tile('Marge brute d’octobre', margin + ' %', 'sur le coût moyen pondéré (PMP)') : '') +
      tile('Impayés clients', fmt(imp), lateClients + ' client(s) avec des factures en retard') +
    '</div>' +
    '<div class="grid-auto">' +
      '<section class="card card-pad"><h2>Ventes du jour par vendeur</h2>' + sellers.map((s) => '<div title="' + esc(s.u.name + ' : ' + fmt(s.v[0]) + ' en ' + s.v[1] + ' ventes') + '" style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;font-size:14px"><b>' + esc(s.u.name) + '</b><span class="num">' + fmt(s.v[0]) + ' <span class="muted">· ' + s.v[1] + ' ventes</span></span></div><div style="height:12px;background:#F0F0EC;border-radius:4px" aria-hidden="true"><div style="height:12px;width:' + Math.round(s.v[0] / max * 100) + '%;background:var(--accent);border-radius:0 4px 4px 0"></div></div></div>').join('') + '</section>' +
      '<section class="card card-pad"><h2>Point de caisse</h2><table class="t num"><thead><tr><th>Mode</th><th class="right">Encaissé</th></tr></thead><tbody><tr><td>Espèces</td><td class="right">' + fmt(day.cash) + '</td></tr><tr><td>Chèques</td><td class="right">' + fmt(day.cheque) + '</td></tr><tr><td>Virements</td><td class="right">' + fmt(day.virement) + '</td></tr><tr><td><b>Total</b></td><td class="right"><b>' + fmt(day.cash + day.cheque + day.virement) + '</b></td></tr></tbody></table>' +
        '<div class="alert a-info">Espèces attendues en caisse : <b>' + fmt(day.cash + 10000 - out) + '</b> (fond de caisse 10 000 DA inclus' + (out ? ', ' + fmt(out) + ' déposés en banque' : '') + ')</div><button class="btn btn-dark" type="button" data-action="modalCashClose">Compter et clôturer la caisse</button></section>' +
      '<section class="card card-pad"><h2>À vérifier</h2>' +
        (S.db.journal.length ? S.db.journal.map((j) => '<div class="alert a-warn">' + ic('warn', 20, '#9A3412') + '<div><b>Attention :</b> vente ' + j.sale + ' interrompue sur le poste ' + esc(j.device) + ' (étape « ' + STEP_LABEL[j.step] + ' », ' + j.invoice + ', ' + fmt(j.ttc) + '). <a href="#/ventes/' + j.invoice + '">Voir</a></div></div>').join('') : '<div class="alert a-ok">' + ic('check', 20) + 'Aucune vente interrompue.</div>') +
        (day.orphans ? '<div class="alert" style="background:var(--bg)">' + ic('info', 20) + '<div style="display:flex;flex-direction:column;gap:8px"><span><b>Info :</b> ' + day.orphans + ' factures brouillon CARUNO de plus de 24 h, sans vente en cours. Sans effet sur le stock.</span><button class="btn btn-outline" type="button" data-action="cleanOrphans" style="align-self:flex-start">Examiner et supprimer</button></div></div>' : '') +
        (chq.length ? '<div class="alert a-info">' + ic('info', 20) + '<div>' + chq.length + ' chèque(s) à remettre en banque, ' + fmt(chq.reduce((t, p) => t + p.amount, 0)) + '. <a href="#/reglements" data-action="regTab" data-arg="cheques">Règlements</a></div></div>' : '') +
        '<div class="alert a-warn">' + ic('warn', 20, '#9A3412') + '<div>' + alerts.length + ' pièces sous le seuil d’alerte. <a href="#/stock">Voir le stock</a></div></div>' +
      '</section>' +
    '</div>';
}
function viewReglements() {
  const tab = S.ui.regTab || 'paiements';
  const all = payments();
  const cheques = all.filter((p) => p.mode === 'cheque' && p.amount > 0 && !p.deposited);
  const sel = S.ui.chkSel || (S.ui.chkSel = {});
  const caisse = 10000 + S.db.day.cash - cashOut();
  const banque = S.db.bank.opening + all.filter((p) => p.mode === 'virement').reduce((t, p) => t + p.amount, 0) + S.db.bank.deposits.reduce((t, x) => t + x.amount, 0) + cashOut();
  const tile = (l, v, s) => '<div class="card kpi"><span class="l">' + l + '</span><span class="v num">' + v + '</span><span class="s">' + s + '</span></div>';
  const amount = (a) => '<span style="font-weight:600;color:' + (a < 0 ? 'var(--bad)' : 'inherit') + '">' + (a < 0 ? '−' : '') + fmt(Math.abs(a)) + '</span>';
  let body;
  if (tab === 'paiements') {
    const f = S.ui.regMode || '';
    const list = all.filter((p) => !f || p.mode === f);
    body = '<div class="toolbar"><label class="sr" for="reg-mode">Mode</label><select id="reg-mode" data-change="regMode"><option value="">Tous les modes</option>' + ['especes', 'cheque', 'virement', 'avoir'].map((k) => '<option value="' + k + '"' + (f === k ? ' selected' : '') + '>' + MODES[k] + '</option>').join('') + '</select></div>' +
      '<div class="card" style="overflow:hidden"><div class="table-wrap"><table class="t" style="min-width:760px"><thead><tr><th>Date</th><th>Document</th><th>Client</th><th>Mode</th><th class="right">Montant</th></tr></thead><tbody>' +
      (list.length ? list.map((p) => '<tr><td class="num">' + dateFr(p.date) + '</td><td><a class="mono" href="#/ventes/' + p.doc.ref + '">' + p.doc.ref + '</a></td><td>' + esc(client(p.doc.client).name) + '</td><td>' + esc(MODES[p.mode] || p.mode) + (p.label ? ' <span class="mono muted">' + esc(p.label) + '</span>' : '') + (p.mode === 'cheque' && p.amount > 0 ? ' ' + (p.deposited ? '<span class="badge b-grey">Remis · ' + esc(p.depositRef) + '</span>' : '<span class="badge b-warn">À remettre</span>') : '') + '</td><td class="right num">' + amount(p.amount) + '</td></tr>').join('') : '<tr><td colspan="5" class="empty">Aucun paiement.</td></tr>') +
      '</tbody></table></div></div>';
  } else if (tab === 'cheques') {
    const picked = cheques.filter((p) => sel[p.key]);
    body = '<div class="card" style="overflow:hidden"><div class="card-head"><h2>' + cheques.length + ' chèque(s) à remettre en banque</h2><button class="btn btn-primary" type="button" data-action="chkDeposit"' + (picked.length ? '' : ' disabled') + '>Créer le bordereau (' + picked.length + ' · ' + fmt(picked.reduce((t, p) => t + p.amount, 0)) + ')</button></div>' +
      '<div class="table-wrap"><table class="t" style="min-width:640px"><thead><tr><th><span class="sr">Choisir</span></th><th>Date</th><th>Facture</th><th>Client</th><th class="right">Montant</th></tr></thead><tbody>' +
      (cheques.length ? cheques.map((p) => '<tr><td><input type="checkbox" id="chk-' + esc(p.key) + '" data-change="chkSel" data-arg="' + esc(p.key) + '"' + (sel[p.key] ? ' checked' : '') + ' style="width:20px;height:20px" aria-label="Chèque ' + esc(p.doc.ref) + '"></td><td class="num">' + dateFr(p.date) + '</td><td><a class="mono" href="#/ventes/' + p.doc.ref + '">' + p.doc.ref + '</a></td><td>' + esc(client(p.doc.client).name) + '</td><td class="right num"><b>' + fmt(p.amount) + '</b></td></tr>').join('') : '<tr><td colspan="5" class="empty">Aucun chèque en attente.</td></tr>') +
      '</tbody></table></div></div>' +
      '<div class="card" style="overflow:hidden"><div class="card-head"><h2>Bordereaux de remise</h2></div><div class="table-wrap"><table class="t" style="min-width:480px"><thead><tr><th>Bordereau</th><th>Date</th><th class="right">Chèques</th><th class="right">Montant</th></tr></thead><tbody>' +
      S.db.bank.deposits.map((x) => '<tr><td class="mono">' + x.ref + '</td><td class="num">' + dateFr(x.date) + '</td><td class="right num">' + x.count + '</td><td class="right num">' + fmt(x.amount) + '</td></tr>').join('') + '</tbody></table></div></div>';
  } else {
    const ops = [].concat(
      all.filter((p) => p.mode === 'virement').map((p) => ({ date: p.date, label: 'Virement reçu · ' + p.doc.ref + ' · ' + client(p.doc.client).name, amount: p.amount })),
      S.db.bank.deposits.map((x) => ({ date: x.date, label: 'Remise de chèques ' + x.ref + ' (' + x.count + ' chèques)', amount: x.amount })),
      S.db.bank.transfers.map((x) => ({ date: x.date, label: 'Dépôt d’espèces de la caisse', amount: x.amount }))
    ).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
    body = '<div class="card" style="overflow:hidden"><div class="table-wrap"><table class="t" style="min-width:560px"><thead><tr><th>Date</th><th>Opération</th><th class="right">Montant</th></tr></thead><tbody>' +
      (ops.length ? ops.map((o) => '<tr><td class="num">' + dateFr(o.date) + '</td><td>' + esc(o.label) + '</td><td class="right num">' + amount(o.amount) + '</td></tr>').join('') : '<tr><td colspan="3" class="empty">Aucune opération.</td></tr>') +
      '</tbody></table></div></div>';
  }
  return head('Règlements', 'Paiements reçus, chèques et comptes du magasin', '<button class="btn" type="button" data-action="modalCashDeposit">Déposer des espèces en banque</button>') +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">' +
      tile('Caisse magasin', fmt(caisse), 'espèces, fond de caisse inclus') +
      tile('Banque', fmt(banque), 'compte courant') +
      tile('Chèques à remettre', fmt(cheques.reduce((t, p) => t + p.amount, 0)), cheques.length + ' chèque(s)') +
      tile('Encaissé aujourd’hui', fmt(S.db.day.cash + S.db.day.cheque + S.db.day.virement), 'espèces, chèques et virements') +
    '</div>' +
    tabs([['paiements', 'Paiements reçus'], ['cheques', 'Chèques à remettre (' + cheques.length + ')'], ['banque', 'Opérations bancaires']], tab, 'regTab') + body;
}

/* =================================================================== MODALS */
function modal(title, body, footer, submit, wide) {

function renderModal() {

    return modal('Transférer ' + esc(p.brand + ' ' + p.ref), '<div class="form-grid"><div class="field"><label for="m-from">De</label><select id="m-from" name="from"><option' + (p.stock['Magasin'] === 0 ? '' : ' selected') + '>Magasin</option><option' + (p.stock['Magasin'] === 0 ? ' selected' : '') + '>Réserve</option></select></div><div class="field"><label for="m-qty">Quantité</label><input class="input num" id="m-qty" name="qty" inputmode="numeric" value="1"></div></div><span class="muted" style="font-size:14px">Stock actuel : Magasin ' + p.stock['Magasin'] + ' · Réserve ' + p.stock['Réserve'] + '</span>', cancel + '<button class="btn btn-primary" type="submit">Transférer</button>', 'mTransfer'); }

function allocate(cid, amount) {
  let left = amount;
  return S.db.docs.filter((d) => d.type === 'facture' && d.client === cid && d.status !== 'payee' && d.status !== 'brouillon').sort((a, b) => a.date < b.date ? -1 : 1)
    .map((d) => { const due = d.ttc - d.paid; const take = Math.max(0, Math.min(due, left)); left -= take; return { d, take, left: due - take }; }).filter((a) => a.take > 0);
}

}

// Validation : la sortie de stock dépend du mode du magasin (facture, ou commande + expédition).
function validateSale(d, steps) {
  const short = d.lines.find((l) => part(l.pid).stock['Magasin'] < l.qty);
  if (short) { toast('Stock Magasin insuffisant pour ' + part(short.pid).brand + ' ' + part(short.pid).ref + ' : validation refusée.'); return false; }
  if (stockMode() === 'shipment') {
    const co = nextRef('CO'), sh = nextRef('SH');
    S.db.docs.push({ ref: co, type: 'commande', client: d.client, date: TODAY, status: 'facturee', ttc: d.ttc, desc: 'Vente comptoir ' + d.saleRef, saleRef: d.saleRef, lines: d.lines.map((l) => Object.assign({ shipped: l.qty }, l)) });
    S.db.docs.push({ ref: sh, type: 'livraison', client: d.client, date: TODAY, status: 'facturee', ttc: d.ttc, desc: 'Vente comptoir ' + d.saleRef, saleRef: d.saleRef, lines: d.lines.map((l) => Object.assign({}, l)), origin: co, stockOut: true });
    d.origins = [sh];
    d.lines.forEach((l) => move(l.pid, 'Expédition ' + sh + ' (vente comptoir)', -l.qty, 'Magasin'));
    steps.push({ t: '2. Commande ' + co + ' et expédition ' + sh + ' validées (stock sorti du Magasin), puis facture validée' });
  } else {
    d.lines.forEach((l) => move(l.pid, 'Vente comptoir — ' + d.ref, -l.qty, 'Magasin'));
    steps.push({ t: '2. Facture validée sur l’entrepôt Magasin : stock sorti' });

  d.status = 'impayee';

function paySale(d, j, steps, resumed) {
  if (!j.pay.length) { steps.push({ t: '3. Vente à crédit : ' + fmt(j.credit) + ' ajoutés à l’encours du client' }); return; }
  const due = d.ttc - (d.paid || 0) - j.credit;
  if (due <= 0) { steps.push({ t: '3. Reste à payer relu : ' + fmt(d.ttc - d.paid) + '. Paiement déjà enregistré, rien n’est payé deux fois', skip: true }); return; }
  let left = due;
  j.pay.forEach((p) => { const a = Math.min(p.amount, left); if (a <= 0) return; recordPayment(d, p.mode, a); if (p.mode === 'avoir') useCredit(d.client, a); left -= a; });
  steps.push({ t: '3. ' + (resumed ? 'Reste à payer relu : ' + fmt(due) + '. ' : '') + 'Paiement ' + j.pay.map((p) => MODES[p.mode].toLowerCase() + ' ' + fmt(p.amount)).join(' + ') + ' enregistré' + (j.credit ? ', ' + fmt(j.credit) + ' à crédit' : '') });
}

  let d = S.db.docs.find((x) => x.type === 'facture' && x.saleRef === j.sale);
  if (d) steps.push({ t: '1. Facture ' + d.ref + ' retrouvée par sa référence externe ' + j.sale + ' : réutilisée, pas de doublon', skip: true });
  else { d = draftSale(j); steps.push({ t: '1. Aucune facture ' + j.sale + ' dans Dolibarr : facture ' + d.ref + ' créée' }); }
  if (d.status === 'brouillon') { if (!validateSale(d, steps)) return null; }
  else steps.push({ t: '2. Facture déjà validée : pas de seconde validation, le stock n’est sorti qu’une fois', skip: true });
  paySale(d, j, steps, true);
  S.db.journal = S.db.journal.filter((x) => x !== j);
  d.steps = steps; save();
  return d;
}
// Facture validée à crédit depuis des commandes ou livraisons. Mode facture : le stock sort ici.
function invoiceFrom(cid, lines, origins, desc) {
  const bill = stockMode() === 'bill', c = client(cid);
  if (bill) {
    const need = {}; lines.forEach((l) => { need[l.pid] = (need[l.pid] || 0) + l.qty; });
    const short = Object.keys(need).find((pid) => part(pid).stock['Magasin'] < need[pid]);
    if (short) { const p = part(short); toast('Stock Magasin insuffisant pour ' + p.brand + ' ' + p.ref + ' : facture refusée (stock négatif interdit).'); return null; }
  }
  const T = totals(lines);
  const fa = { ref: nextRef('FA'), type: 'facture', client: cid, date: TODAY, due: '2026-12-01', status: 'impayee', ttc: T.ttc, paid: 0, desc, lines: lines.map((l) => ({ pid: l.pid, qty: l.qty, price: l.price })), origins, payments: [] };
  S.db.docs.push(fa);
  if (bill) fa.lines.forEach((l) => move(l.pid, 'Facture ' + fa.ref + ' (' + c.name + ')', -l.qty, 'Magasin'));
  addSale(T.ttc);
  return fa;
}

function compress(file) {
  return new Promise((resolve) => {
    if (!file) return resolve(null);
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, 1280 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const url = c.toDataURL('image/jpeg', 0.72); resolve({ url, kb: Math.round(url.length * 0.75 / 1024) }); }; img.onerror = () => resolve(null); img.src = r.result; };
    r.onerror = () => resolve(null);
    r.readAsDataURL(file);
  });
}

/* =================================================================== EVENTS */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-action]');
  if (!el || !A[el.dataset.action]) return;
  // The modal backdrop closes only on a click on itself; clicks inside the dialog (submit buttons…) keep their default.
  if (el.dataset.action === 'closeModalBg') { if (ev.target === el) { S.ui.modal = null; render(); } return; }
  if (el.tagName === 'A' && el.dataset.action !== 'drawer') { A[el.dataset.action](el, ev); return; }
  if (el.tagName === 'TR' && ev.target.closest('a,button,input,select,label')) return;
  ev.preventDefault();
  if (A[el.dataset.action](el, ev) !== false) render();
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  const form = el.closest('[data-form]');
  if (form && el.name) { S.ui.form[el.name] = el.type === 'checkbox' ? el.checked : el.value; return; }
  if (el.dataset.input && I[el.dataset.input]) { if (I[el.dataset.input](el.value, el) !== false) render(); }
});
document.addEventListener('change', async (ev) => {
  const el = ev.target;
  const form = el.closest('[data-form]');
  if (form && el.name && el.tagName === 'SELECT') { S.ui.form[el.name] = el.value; return; }
  if (el.dataset.change && C[el.dataset.change]) { await C[el.dataset.change](el.value, el); render(); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && S.ui.modal) { S.ui.modal = null; render(); return; }
  const el = ev.target;
  if (ev.key === 'Enter' && el.dataset && el.dataset.enter && E[el.dataset.enter]) { ev.preventDefault(); E[el.dataset.enter](el); render(); }
});
document.addEventListener('submit', (ev) => {
  const form = ev.target.closest('[data-submit]');
  if (!form || !F[form.dataset.submit]) return;
  ev.preventDefault();
  F[form.dataset.submit](form, new FormData(form));
  render();
});
