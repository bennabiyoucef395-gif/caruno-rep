<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARUNO — Maquette magasin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F1;--surface:#FFFFFF;--soft:#FAFAF8;--ink:#17191E;--muted:#4B5060;--line:#DADBD6;--line2:#ECECE8;
  --dark:#17191E;--dark2:#23262E;--dark-ink:#E4E5EA;
  --accent:#C2410C;--accent-hover:#9A3412;--accent-weak:#FBEADF;--accent-ink:#7C2D12;
  --ok:#14532D;--ok-bg:#E9F6EE;--warn:#9A3412;--warn-bg:#FFF4E5;--bad:#991B1B;--bad-bg:#FDECEC;--info:#1E3A8A;--info-bg:#E8EEFC;
  --mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1D4ED8;outline-offset:2px}
h1{font-size:26px;margin:0;line-height:1.2}h2{font-size:17px;margin:0}h3{font-size:15px;margin:0}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.right{text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.ribbon{background:#FFF4E5;color:#5C2A06;font-size:13px;padding:6px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #F1C48B}
.ribbon button{background:none;border:0;text-decoration:underline;cursor:pointer;color:#5C2A06;padding:4px}
.shell{display:flex;min-height:calc(100vh - 31px)}
.side{width:236px;flex:none;background:var(--dark);color:#fff;display:flex;flex-direction:column;padding:16px 12px;gap:4px;position:sticky;top:0;height:calc(100vh - 31px);overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:4px 10px 18px}
.brand b{font-size:21px;letter-spacing:.09em}.brand span{font-size:12px;color:#C9CBD2}
.nav a{display:flex;align-items:center;gap:12px;color:var(--dark-ink);text-decoration:none;padding:0 12px;min-height:44px;border-radius:9px;font-size:15px}
.nav a:hover{background:var(--dark2);color:#fff}
.nav a[aria-current="page"]{background:var(--accent);color:#fff;font-weight:600}
.nav svg{flex:none}
.side .me{margin-top:auto;border-top:1px solid #33363F;padding:12px 10px 0;display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-toggle{width:34px;height:34px;flex:none;border-radius:8px;border:1px solid #3A3E48;background:transparent;color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.nav-toggle:hover{background:var(--dark2)}
.nav-toggle svg{transition:transform .15s}
/* menu replié : icônes seules (écran large uniquement ; sur téléphone le menu reste un tiroir complet) */
@media (min-width:901px){
  .side{transition:width .15s}
  .side.collapsed{width:72px;padding:16px 10px}
  .side.collapsed .brand{padding:4px 0 18px;align-items:center}
  .side.collapsed .brand-row{justify-content:center}
  .side.collapsed .brand b,.side.collapsed .brand > span,.side.collapsed .nav a span,.side.collapsed .me > span:last-child{display:none !important}
  .side.collapsed .nav-toggle svg{transform:rotate(180deg)}
  .side.collapsed .nav a{justify-content:center;padding:0}
  .side.collapsed .me{justify-content:center;padding:12px 0 0}
}
@media (max-width:900px){.nav-toggle{display:none}}
.avatar{width:36px;height:36px;border-radius:50%;background:#3A3E48;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.content{width:100%;max-width:1480px;margin:0 auto;padding:22px;display:flex;flex-direction:column;gap:18px}
.bottomnav{display:none}
.drawer-bg{display:none}
@media (max-width:900px){
  .side{display:none}
  .side.open{display:flex;position:fixed;z-index:40;left:0;top:0;height:100vh}
  .drawer-bg.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:39}
  .topbar{display:flex;align-items:center;gap:10px;background:var(--dark);color:#fff;padding:8px 12px;position:sticky;top:0;z-index:20}
  .topbar b{letter-spacing:.08em;font-size:18px}
  .topbar .icon-btn{background:var(--dark2);color:#fff;border:0}
  .content{padding:14px 14px 96px}
  .bottomnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:20;padding:4px 4px 10px}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;font-size:11px;color:var(--muted);text-decoration:none}
  .bottomnav a[aria-current="page"]{color:var(--accent);font-weight:700}
  h1{font-size:22px}
}

/* components */
.page-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.page-head .sub{font-size:14px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#B9BAB3;color:var(--ink)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff}
.btn-dark{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:600}
.btn-dark:hover{background:#000;color:#fff}
.btn-outline{border-color:var(--ink);font-weight:600}
.btn-lg{min-height:54px;font-size:17px;font-weight:700;border-radius:12px}
.btn:disabled{background:#E4E4DF;border-color:#E4E4DF;color:var(--muted);cursor:not-allowed}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.card-pad{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;align-items:start}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-info{background:var(--info-bg);color:var(--info)}.b-grey{background:#ECECE8;color:#3D414C}.b-accent{background:var(--accent-weak);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #CFD0CA;background:#fff;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{min-height:46px;padding:0 14px;border:0;background:none;cursor:pointer;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 280px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #CFD0CA;border-radius:10px;padding:0 12px;min-height:46px}
.search input{border:0;outline:none;flex:1 1 auto;min-width:0;background:transparent;font-size:15px;height:44px}
.search.big{border:2px solid var(--ink);min-height:56px;border-radius:12px}
.search.big input{font-size:17px}
select,.input,textarea{min-height:44px;border:1px solid #CFD0CA;border-radius:10px;background:#fff;padding:0 12px;font-size:15px}
textarea{padding:10px 12px;min-height:88px;resize:vertical}
.input.num{text-align:right}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:600;color:#3D414C}
.field .hint{font-size:12px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 16px}
.form-section{display:flex;flex-direction:column;gap:12px}
.form-section h2{padding-bottom:8px;border-bottom:1px solid var(--line2)}
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#FBFBF9}
table.t td a.rowlink{color:var(--ink);text-decoration:none;font-weight:600}
table.t td a.rowlink:hover{text-decoration:underline}
.thumb{width:44px;height:44px;border-radius:8px;background:#EEEEEA;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.cellpart{display:flex;align-items:center;gap:12px}
.cellpart .t1{font-weight:600}.cellpart .t2{font-size:13px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.kpi{display:flex;flex-direction:column;gap:6px;padding:16px 18px}
.kpi .v{font-size:28px;font-weight:700;line-height:1.1}
.kpi .l{font-size:14px;color:var(--muted)}.kpi .s{font-size:13px;color:var(--muted)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:14px}
.alert svg{flex:none;margin-top:1px}
.a-warn{background:var(--warn-bg);color:#5C2A06}.a-info{background:var(--info-bg);color:var(--info)}.a-ok{background:var(--ok-bg);color:var(--ok)}.a-bad{background:var(--bad-bg);color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.meter{height:12px;border-radius:999px;background:#ECECE8;overflow:hidden}.meter>div{height:100%;border-radius:999px}
.qty{display:inline-flex;align-items:center;border:1px solid #CFD0CA;border-radius:10px;background:#fff}
.qty button{width:42px;height:42px;border:0;background:none;font-size:20px;cursor:pointer}
.qty span{min-width:26px;text-align:center;font-weight:600}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.photo{position:relative;aspect-ratio:1;border-radius:10px;background:#EEEEEA;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);text-align:center;border:2px solid transparent}
.photo.main{border-color:var(--accent)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .tag{position:absolute;left:4px;top:4px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px}
.photo .ops{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(23,25,30,.75)}
.photo .ops button{flex:1;border:0;background:none;color:#fff;font-size:11px;min-height:28px;cursor:pointer}
.photo-add{border:2px dashed #8A8F9C;background:#fff;cursor:pointer;color:var(--ink);font-weight:600;flex-direction:column;gap:4px}
.photo-add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.big-photo{aspect-ratio:4/3;border-radius:12px;background:#EEEEEA;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--muted);overflow:hidden}
.big-photo img{width:100%;height:100%;object-fit:contain;background:#fff}
.bars{height:58px;background:repeating-linear-gradient(90deg,#000 0 2px,#fff 2px 4px,#000 4px 5px,#fff 5px 8px,#000 8px 11px,#fff 11px 12px)}
.label-prev{width:300px;max-width:100%;border:1px dashed #8A8F9C;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:60;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;max-width:min(560px,calc(100vw - 32px));box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (max-width:900px){.toast{bottom:84px}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.cam{position:relative;border-radius:18px;background:#2B2F38;min-height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cam .frame{width:min(280px,80%);height:140px;border:3px solid #fff;border-radius:14px;display:flex;align-items:center;justify-content:center}
.cam .beam{width:88%;height:3px;border-radius:2px;background:var(--accent)}
.cam .beam.ok{background:#22C55E}
.cam .hint{position:absolute;top:12px;left:0;right:0;text-align:center;color:#E4E5EA;font-size:14px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--dark)}
.login .box{width:min(440px,100%);display:flex;flex-direction:column;gap:22px;color:#fff}
.login .acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.login .acc button{min-height:56px;border-radius:12px;border:1px solid #4A4E59;background:var(--dark2);color:#fff;text-align:left;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.login .acc button[aria-pressed="true"]{border:2px solid var(--accent);background:#2E1E16}
.login .acc small{color:#C9CBD2;font-size:12px}
.login input{background:var(--dark2);border-color:#4A4E59;color:#fff}
.login label{color:var(--dark-ink)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.pay-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:8px;align-items:center}
.demo{border:1px dashed #F1C48B;background:#FFFBF5;border-radius:10px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:#5C2A06}
.demo select{min-height:36px;font-size:13px;flex:1 1 180px}
.steps .skip{color:var(--muted)}
.modal.wide{width:min(820px,100%)}
.print-area{background:#fff;color:#000;border:1px solid var(--line);border-radius:8px;padding:20px;font-size:13px;display:flex;flex-direction:column;gap:12px}
.print-area.ticket{width:300px;max-width:100%;margin:0 auto;font-family:var(--mono);font-size:12px;padding:14px;gap:8px}
.print-area table{width:100%;border-collapse:collapse}
.print-area th,.print-area td{padding:4px 6px;border-bottom:1px solid #DDD;text-align:left;vertical-align:top}
.print-area .r{text-align:right;white-space:nowrap}
.print-area .ids{font-size:11px;color:#333}
@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;left:0;top:0;width:100%;border:0}
  .print-area.ticket{width:72mm}
}
/* point de vente plein écran */
.pos-frame{display:flex;flex-direction:column;height:100vh;height:100dvh}
.pos{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative}
.pos-top{display:flex;align-items:center;gap:8px;background:var(--dark);color:#fff;padding:6px 10px;min-height:58px;flex:none}
.pos-top .brand2{font-weight:700;letter-spacing:.09em;padding:0 6px;font-size:17px}
.pos-tabs{display:flex;gap:4px;overflow-x:auto;flex:1 1 auto;min-width:0}
.pos-tab{min-height:42px;padding:0 12px;border-radius:8px;border:0;background:var(--dark2);color:var(--dark-ink);cursor:pointer;white-space:nowrap;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.pos-tab[aria-current="true"]{background:#fff;color:var(--ink);font-weight:700}
.pos-btn{min-height:42px;padding:0 12px;border-radius:8px;border:1px solid #3A3E48;background:transparent;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
a.pos-btn{text-decoration:none}
.pos-btn:hover{color:#fff;background:var(--dark2)}
.pos-menu{position:absolute;right:8px;top:62px;z-index:35;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);min-width:260px;padding:6px;display:flex;flex-direction:column}
.pos-menu a,.pos-menu button{min-height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;border:0;background:none;border-radius:8px;font-size:15px;color:var(--ink);text-decoration:none;cursor:pointer;text-align:left}
.pos-menu a:hover,.pos-menu button:hover{background:var(--bg)}
.pos-main{flex:1 1 auto;min-height:0;display:flex;overflow:hidden}
.pos-scroll{flex:1 1 auto;overflow-y:auto;min-width:0}
.pos-order{width:410px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ord-head{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.ord-client{flex:1;min-height:52px;display:flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);cursor:pointer;font-size:14px;color:var(--ink)}
.cart-close{display:none}
.ord-lines{flex:1 1 auto;overflow-y:auto;min-height:80px}
.ol{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:0;border-bottom:1px solid var(--line2);border-left:4px solid transparent;cursor:pointer;width:100%;background:none;text-align:left;color:var(--ink)}
.ol[aria-pressed="true"]{background:#FFF4EC;border-left-color:var(--accent)}
.olw{border-bottom:1px solid var(--line2)}
.olw .ol{border-bottom:0}
.chg{display:block;font-size:12px;margin-top:2px}
.chg s{color:var(--muted)}
.ol-alert{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 14px 10px 18px;font-size:13px;font-weight:600}
.ol-alert.bad{color:var(--bad)}.ol-alert.warn{color:var(--warn)}.ol-alert.info{color:var(--muted);font-weight:500}
.ol-alert .btn{min-height:36px;padding:0 10px;font-size:13px}
.ol-edit{display:flex;flex-direction:column;gap:8px;padding:2px 14px 12px 18px;background:#FFF4EC;border-left:4px solid var(--accent)}
.ol-row{display:flex;gap:8px;align-items:flex-end}
.ol-edit .field{gap:4px}.ol-edit .lbl,.ol-edit label{font-size:12px}
.ol-edit .input{min-height:46px;padding:0 10px;width:100%}
.ol-edit .icon-btn{width:46px;height:46px;flex:none}
.price-in{font-size:22px;font-weight:700}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pc{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:46px;border-radius:10px;border:1px solid #CFD0CA;background:#fff;padding:4px 10px;line-height:1.2;cursor:pointer;color:var(--ink)}
.pc span{font-size:11px;color:var(--muted)}
.pc b{font-size:14px}
.pc[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pc[aria-pressed="true"] span{color:#D6D7DC}
.pc.info{cursor:default;background:var(--soft);border-style:dashed}
.ol-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.linkbtn{border:0;background:none;color:#1D4ED8;text-decoration:underline;cursor:pointer;padding:4px;font-size:13px}

<script>
/* ===================================================================
   CARUNO — application du magasin de pièces auto.
   Interface de la maquette validée ; données lues et écrites dans le Dolibarr du magasin (caruno-dolibarr.js).
   Gardé sur ce poste : commandes en cours, journal des ventes, session de caisse.
   =================================================================== */
'use strict';
const KEY = 'caruno-app-v1';
const TODAY = (() => { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); })();
const DEVICE = (() => { try { return localStorage.getItem('caruno-device') || 'Comptoir 1'; } catch (e) { return 'Comptoir 1'; } })(); // ce poste : les ventes de son journal lui appartiennent
const LEVELS = ['Public', 'Garage', 'Gros']; // niveaux de prix ; la catégorie client « Revendeur » paie le prix de gros
const CAT_LEVEL = { Particulier: 0, Garage: 1, Revendeur: 2 };
const FAMILIES = ['Moteur', 'Filtration', 'Freinage', 'Embrayage et transmission', 'Suspension et direction', 'Électricité et électronique', 'Refroidissement et climatisation', 'Carrosserie et accessoires'];
const WAREHOUSES = ['Magasin', 'Réserve'];
const ROLES = { vendeur: 'Vendeur', magasinier: 'Magasinier', comptable: 'Comptable', responsable: 'Responsable', gerant: 'Gérant' };
const SEE_COST = ['gerant', 'responsable', 'comptable'];
const EDIT_PARTS = ['magasinier', 'responsable', 'gerant'];
const BELOW_FLOOR = ['gerant'];
const OVER_LIMIT = ['gerant'];
const MODES = { especes: 'Espèces', cheque: 'Chèque', virement: 'Virement', avoir: 'Avoir client', credit: 'À crédit' };
const STOCK_MODES = { bill: 'sortie à la validation de la facture', shipment: 'sortie à la validation de l’expédition' };
const STEP_LABEL = { validation: 'validation de la facture', paiement: 'encaissement' };

/* ---------- icons ---------- */
const P = {
  caisse: '<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/>',
  pieces: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/>',
  catalogue: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  stock: '<path d="M3 21V8l9-5 9 5v13"/><path d="M7 21v-8h10v8"/><path d="M7 17h10"/>',
  clients: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14a6.5 6.5 0 0 1 3.5 6"/>',
  ventes: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/>',
  achats: '<path d="M1 4h13v12H1z"/><path d="M14 9h4l4 4v3h-8"/><circle cx="5.5" cy="18.5" r="2"/><circle cx="17.5" cy="18.5" r="2"/>',
  scanner: '<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8"/><path d="M10 8v8"/><path d="M13 8v8"/><path d="M17 8v8"/>',

  camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  warn: '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M11 12h1v5h1"/>',
  menu: '<path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
  more: '<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
  reglements: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01"/><path d="M18 12h.01"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  print: '<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/>'
};
function ic(name, size, color) {
  return '<svg aria-hidden="true" width="' + (size || 20) + '" height="' + (size || 20) + '" viewBox="0 0 24 24" fill="none" stroke="' + (color || 'currentColor') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + P[name] + '</svg>';
}

/* ---------- données vides : remplies depuis Dolibarr à la connexion ---------- */
function seed() {
  return {
    parts: [], suppliers: [], clients: [], docs: [], pos: [], moves: [], users: [],
    day: { base: 0, count: 0, cash: 0, cheque: 0, virement: 0, sellers: {}, orphans: 0 }, months: {}, monthKeys: [],
    shop: { name: '', address: '', phone: '', rc: '', nif: '', ai: '', nis: '', vat: false },
    stockMode: 'bill', journal: [], bank: { opening: 0, transfers: [], deposits: [] }, posOrders: [], session: null, sessions: [], counters: { V: 0, CS: 0 }
  };
}

/* ---------- state ---------- */
const S = { db: load(), user: loadUser(), ui: { caisse: null, modal: null, toast: '', drawer: false, form: {}, formKey: '' } };
// Données d'une ancienne version (sans commandes en cours ni session de caisse) : on repart des données de test.
// Les données du magasin viennent de Dolibarr ; seul l'état de ce poste est gardé dans le navigateur.
function load() { return Object.assign(seed(), loadPoste()); }
function save() {
  try { localStorage.setItem(POSTE_KEY, JSON.stringify({ posOrders: S.db.posOrders, journal: S.db.journal, session: S.db.session, sessions: S.db.sessions.slice(0, 30), counters: S.db.counters, stockMode: S.db.stockMode })); } catch (e) {}
}
function loadUser() { try { return JSON.parse(sessionStorage.getItem(KEY + '-user')); } catch (e) { return null; } }
function saveUser() { try { sessionStorage.setItem(KEY + '-user', JSON.stringify(S.user)); } catch (e) {} }

/* ---------- helpers ---------- */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Math.round(n || 0).toLocaleString('fr-FR') + ' DA';
// Magasin assujetti ou non à la TVA (profil magasin). Sans TVA : pièces à 0 %, ni « HT » ni « TTC » à l'écran.
const VAT = () => !!(S.db && S.db.shop && S.db.shop.vat);
const xHT = () => VAT() ? ' HT' : '';
const xTTC = () => VAT() ? ' TTC' : '';
const ttc = (ht, rate) => Math.round(ht * (1 + (rate == null ? 19 : rate) / 100));
const norm = (x) => String(x || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[\s.\-]/g, '');
const dateFr = (d) => d ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) : '';
const nowStr = () => { const d = new Date(); return TODAY + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const part = (id) => S.db.parts.find((p) => p.id === Number(id));
const client = (id) => S.db.clients.find((c) => c.id === id);
const supplier = (id) => S.db.suppliers.find((s) => s.id === id);
const doc = (ref) => S.db.docs.find((d) => d.ref === ref);
const po = (ref) => S.db.pos.find((d) => d.ref === ref);
const lvl = (c) => CAT_LEVEL[(c || {}).cat] || 0;
const total = (p) => p.stock['Magasin'] + p.stock['Réserve'];
const role = () => S.user ? S.user.role : '';
const seeCost = () => SEE_COST.indexOf(role()) !== -1;
const can = (list) => list.indexOf(role()) !== -1;
const stockMode = () => S.db.stockMode || 'bill';
const cashOut = () => S.db.bank.transfers.reduce((t, x) => t + x.amount, 0);
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
function nextRef(prefix) { S.db.counters[prefix] = (S.db.counters[prefix] || 0) + 1; return prefix + (prefix === 'V' ? '-' : TODAY.slice(2, 4) + TODAY.slice(5, 7) + '-') + String(S.db.counters[prefix]).padStart(4, '0'); }
function search(q, list) { const n = norm(q); return n ? list.filter((p) => [p.name, p.brand, p.ref, p.oem, p.ean, p.fam, p.type, partAlt(p)].some((f) => norm(f).indexOf(n) !== -1)) : list; }
function encours(cid) { return S.db.docs.filter((d) => d.type === 'facture' && d.client === cid && d.status !== 'payee' && d.status !== 'brouillon').reduce((t, d) => t + d.ttc - (d.paid || 0), 0); }
function move(pid, label, qty, wh) { S.db.moves.unshift({ date: nowStr(), pid: Number(pid), label, qty, wh, user: S.user.login }); part(pid).stock[wh] += qty; }
// TVA calculée par taux, d'après la TVA de chaque pièce (19, 9 ou 0 %).
function totals(lines, parts) {
  const rates = {};
  lines.forEach((l) => { const p = (parts || S.db.parts).find((x) => x.id === Number(l.pid)); const r = p ? p.tva : 19; rates[r] = (rates[r] || 0) + l.price * l.qty; });
  const vat = Object.keys(rates).map(Number).sort((a, b) => b - a).map((r) => ({ rate: r, base: rates[r], tva: Math.round(rates[r] * r / 100) }));
  const ht = vat.reduce((t, v) => t + v.base, 0), tva = vat.reduce((t, v) => t + v.tva, 0);
  return { ht, tva, ttc: Math.round(ht + tva), vat };
}
function vatRows(T) { return T.vat.filter((v) => v.tva).map((v) => '<div style="display:flex;justify-content:space-between"><span class="muted">TVA ' + v.rate + ' %</span><span>' + fmt(v.tva) + '</span></div>').join(''); }
function unbilled(cid) { return S.db.docs.filter((d) => d.type === 'livraison' && d.status === 'validee' && d.client === cid); }
function mergeLines(docs) { const out = []; docs.forEach((d) => d.lines.forEach((l) => { const x = out.find((o) => o.pid === l.pid && o.price === l.price); if (x) x.qty += l.qty; else out.push({ pid: l.pid, qty: l.qty, price: l.price }); })); return out; }
function linked(d) { return S.db.docs.filter((x) => x.origin === d.ref || (x.origins || []).indexOf(d.ref) !== -1); }
// Documents à cheval entre les deux modes de stock : changer de mode les sortirait deux fois ou jamais.
function modeBlockers() { return S.db.docs.filter((d) => (d.type === 'livraison' && d.status === 'validee') || (d.type === 'commande' && d.status === 'livree_part')).map((d) => d.ref); }
// Avoirs Dolibarr à valoir : pas encore utilisables comme paiement à la caisse.
function creditOf() { return 0; }
function useCredit(cid, amount) {
  let left = amount;
  S.db.docs.filter((d) => d.type === 'avoir' && d.client === cid && d.status === 'a_valoir').sort((a, b) => a.date < b.date ? -1 : 1).forEach((d) => { const take = Math.min(d.left, left); d.left -= take; left -= take; if (!d.left) d.status = 'utilise'; });
}
// Vente à crédit : jamais pour le client comptoir ; sans plafond ou au-delà du plafond, seul le gérant passe outre.
function creditCheck(cid, amount) {
  const c = client(cid);
  if (!amount) return { block: false, msg: '' };
  if (c.fixed) return { block: true, msg: 'Pas de crédit pour le client comptoir : choisissez la fiche du client.' };
  const enc = encours(cid);
  let msg = '';
  if (!c.plafond) msg = c.name + ' paie comptant : pas de crédit autorisé.';
  else if (enc + amount > c.plafond) msg = 'Plafond dépassé : encours après vente ' + fmt(enc + amount) + ' pour un plafond de ' + fmt(c.plafond) + '.';
  if (!msg) return { block: false, msg: '' };
  return can(OVER_LIMIT) ? { block: false, msg: msg + ' Validation possible par le gérant.' } : { block: true, msg: msg + ' Seul le gérant peut valider.' };
}
function recordPayment(d, mode, amount, extra) {
  d.payments = d.payments || [];
  d.payments.push(Object.assign({ date: TODAY, mode, amount, user: S.user.login }, extra || {}));
  if (d.type === 'facture') { d.paid = (d.paid || 0) + amount; d.status = d.paid >= d.ttc ? 'payee' : 'partielle'; }
  const k = { especes: 'cash', cheque: 'cheque', virement: 'virement' }[mode];
  if (k) S.db.day[k] += amount;
}
function addSale(amount) {
  const d = S.db.day, s = d.sellers[S.user.login] || (d.sellers[S.user.login] = [0, 0]);
  d.extra = (d.extra || 0) + amount; d.count++; s[0] += amount; s[1]++;
}
// Montant en lettres pour les factures (orthographe rectifiée : traits d'union partout).
function words(n) {
  const u = ['zéro', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf'];
  const t = ['', '', 'vingt', 'trente', 'quarante', 'cinquante', 'soixante', 'soixante', 'quatre-vingt', 'quatre-vingt'];
  const below100 = (x, last) => {
    if (x < 20) return u[x];
    const d = Math.floor(x / 10), r = x % 10;
    if (d === 7 || d === 9) return t[d] + (d === 7 && r === 1 ? '-et-' : '-') + u[10 + r];
    if (d === 8) return r ? t[d] + '-' + u[r] : t[d] + (last ? 's' : '');
    return t[d] + (r === 1 ? '-et-un' : r ? '-' + u[r] : '');
  };
  const below1000 = (x, last) => {
    const c = Math.floor(x / 100), r = x % 100;
    const h = c === 0 ? '' : c === 1 ? 'cent' : u[c] + '-cent' + (!r && last ? 's' : '');
    return r ? (h ? h + '-' : '') + below100(r, last) : h;
  };
  n = Math.round(Math.abs(n));
  if (!n) return 'zéro';
  const m = Math.floor(n / 1e6), k = Math.floor(n % 1e6 / 1000), r = n % 1000, out = [];
  if (m) out.push(below1000(m, true) + (m > 1 ? '-millions' : '-million'));

/* =================================================================== CATALOGUE (vraies pièces Dolibarr, lecture seule)
   Seul écran branché sur Dolibarr : connexion par POST /login (jeton DOLAPIKEY de l'utilisateur),
   recherche GET /products (sqlfilters sur oem_ref, ref, désignation, description), fiche GET /products/{id}.
   Rien n'est écrit dans Dolibarr. */
const CAT_PAGE = 30;
function catUi() {
  if (!S.ui.cat) {
    let saved = {};
    try { saved = JSON.parse(sessionStorage.getItem(KEY + '-doli')) || {}; } catch (e) {}
    S.ui.cat = { url: DOLI.apiRoot(DOLI.url).replace(/\/api\/index\.php$/, ''), login: S.user ? S.user.login : '', token: DOLI.token, q: '', items: [], total: 0, page: 0, loading: false, err: '', seq: 0, piece: null, thumbs: {} };
  }
  return S.ui.cat;
}
function catSaveConn() { const c = catUi(); try { sessionStorage.setItem(KEY + '-doli', JSON.stringify({ url: c.url, login: c.login, token: c.token })); } catch (e) {} }
async function doli(path, opts) {
  const c = catUi(), o = opts || {};
  const headers = { Accept: 'application/json' };
  if (o.body) headers['Content-Type'] = 'application/json';
  if (c.token) headers.DOLAPIKEY = c.token;
  let res;
  try { res = await fetch(c.url.replace(/\/+$/, '') + '/api/index.php/' + path, { method: o.method || 'GET', headers, body: o.body ? JSON.stringify(o.body) : undefined }); }
  catch (e) { throw new Error('Dolibarr injoignable à ' + c.url + '.'); }
  if ((res.status === 401 || res.status === 403) && path !== 'login') { c.token = ''; catSaveConn(); throw new Error('Session Dolibarr expirée : reconnectez-vous.'); }
  if (res.status === 404) return null;  // liste vide ou pièce absente
  if (!res.ok) throw new Error(res.status === 403 && path === 'login' ? 'Identifiant ou mot de passe refusé.' : 'Erreur Dolibarr ' + res.status + '.');
  return res.json();
}
async function catLogin(url, login, password) {
  const c = catUi();
  c.url = url || c.url; c.login = login; c.err = ''; c.loading = true; render();
  try {
    const r = await doli('login', { method: 'POST', body: { login, password, reset: 0 } });
    c.token = r && r.success ? r.success.token : '';
    if (!c.token) throw new Error('Identifiant ou mot de passe refusé.');
    catSaveConn();
    c.loading = false;
    toast('Connecté à Dolibarr : ' + login + '.');
    await catSearch(0);
  } catch (e) { c.loading = false; c.err = e.message; render(); }
}
// Quotes and brackets would break the sqlfilters expression; OEM is compared without spaces, dots or dashes like oem_ref.
const sqlSafe = (s) => String(s).replace(/['"()\\%_]/g, ' ').trim();
async function catSearch(page) {
  const c = catUi(), seq = ++c.seq, q = sqlSafe(c.q), oem = q.toUpperCase().replace(/[\s.\-]/g, ''), words = q.replace(/\s+/g, '%');
  const filter = q ? "(ef.oem_ref:like:'%" + oem + "%') or (t.ref:like:'%" + oem + "%') or (t.label:like:'%" + words + "%') or (t.description:like:'%" + words + "%')" + searchExtra(q) : '';
  const params = new URLSearchParams({ limit: CAT_PAGE, page, sortfield: 't.label', sortorder: 'ASC', pagination_data: 'true', includestockdata: '1', properties: 'id,ref,label,description,stock_reel,array_options' });
  if (filter) params.set('sqlfilters', filter);
  c.searched = true; c.loading = true; c.err = ''; render();
  try {
    const r = await doli('products?' + params.toString());
    if (seq !== c.seq) return;  // a newer search is on its way
    c.items = r ? r.data : []; c.total = r ? r.pagination.total : 0; c.page = page;
  } catch (e) { if (seq === c.seq) c.err = e.message; }
  if (seq === c.seq) { c.loading = false; render(); catLoadThumbs(seq); }
}
// List thumbnails: the _small thumbnail Dolibarr made (_mini is too compressed to read) for the imported photo <ref>.jpg (one call per part,
// 6 at a time, kept for the session; '' = no photo). Photos added by hand under another name show on the card only.
async function catLoadThumbs(seq) {
  const c = catUi(), todo = c.items.map((p) => p.ref).filter((ref) => !(ref in c.thumbs));
  for (let i = 0; i < todo.length && seq === c.seq; i += 6) {
    await Promise.all(todo.slice(i, i + 6).map(async (ref) => {
      try {
        const d = await doli('documents/download?' + new URLSearchParams({ modulepart: 'product', original_file: ref + '/thumbs/' + ref + '_small.jpg' }).toString());
        c.thumbs[ref] = d && d.content ? 'data:' + d['content-type'] + ';base64,' + d.content : '';
      } catch (e) { c.thumbs[ref] = ''; }
    }));
    if (seq === c.seq) render();
  }
}
async function catLoadPiece(id) {
  const c = catUi();
  c.piece = { id, loading: true };
  try {
    const p = await doli('products/' + encodeURIComponent(id) + '?includestockdata=1');
    if (!p) { c.piece = { id, missing: true }; render(); return; }
    const oem = (p.array_options || {}).options_oem_ref || '';
    const eq = oem ? await doli('products?' + new URLSearchParams({ limit: 50, includestockdata: '1', properties: 'id,ref,label,stock_reel', sqlfilters: "(ef.oem_ref:=:'" + sqlSafe(oem) + "')" }).toString()) : [];
    c.piece = { id, p, eq: (eq || []).filter((x) => String(x.id) !== String(p.id)), photo: await catPhoto(p) };
  } catch (e) { c.piece = { id, err: e.message }; }
  render();
}
// Première image jointe à la pièce (GET /documents puis /documents/download, contenu en base64).
async function catPhoto(p) {
  const files = await doli('documents?' + new URLSearchParams({ modulepart: 'product', id: p.id }).toString());
  const img = (files || []).find((f) => /\.(jpe?g|png|webp)$/i.test(f.name) && !/\/thumbs\//.test(f.fullname || ''));
  if (!img) return '';
  const d = await doli('documents/download?' + new URLSearchParams({ modulepart: 'product', original_file: p.ref + '/' + img.relativename }).toString());
  return d && d.content ? 'data:' + d['content-type'] + ';base64,' + d.content : '';
}
// La description importée porte « Modèles : … / Véhicules : … / OEM : … », une information par ligne.
function catInfo(desc) {
  const out = {};
  String(desc || '').split(/\n|<br\s*\/?>/i).forEach((l) => { const m = l.match(/^\s*([^:]+?)\s*:\s*(.+)$/); if (m) out[m[1]] = m[2]; });
  return out;
}

/* =================================================================== TABLEAU DE BORD */
function viewTableau() {
  const day = S.db.day, mo = S.db.months;
  const ca = day.base + (day.extra || 0);
  const imp = S.db.clients.reduce((t, c) => t + encours(c.id), 0);
  const lateClients = S.db.clients.filter((c) => S.db.docs.some((d) => d.client === c.id && d.type === 'facture' && d.status !== 'payee' && d.due && d.due < TODAY)).length;
  const alerts = S.db.parts.filter((p) => total(p) < p.seuil);
  const chq = payments().filter((p) => p.mode === 'cheque' && p.amount > 0 && !p.deposited);
  const priced = S.db.docs.filter((d) => d.type === 'facture' && d.date === TODAY && d.notePrivate);
  const sellers = Object.keys(day.sellers).map((k) => ({ u: S.db.users.find((x) => x.login === k), v: day.sellers[k] })).sort((a, b) => b.v[0] - a.v[0]);
  const max = Math.max.apply(null, sellers.map((s) => s.v[0]));
  const tile = (l, v, s) => '<div class="card kpi"><span class="l">' + l + '</span><span class="v num">' + v + '</span><span class="s">' + s + '</span></div>';
  DOLI.need('day', () => DOLI.loadDayPayments());
  const sep = mo[S.db.monthKeys[0]] || { ttc: 0, cost: 0 }, oct = mo[S.db.monthKeys[1]] || { ttc: 0, cost: 0 };
  const MN = S.db.monthKeys.map((k) => new Date(k + '-01T12:00').toLocaleDateString('fr-FR', { month: 'long' }));
  const growth = sep.ttc ? Math.round((oct.ttc - sep.ttc) / sep.ttc * 100) : 0;
  const octHt = oct.ttc / (VAT() ? 1.19 : 1), margin = octHt ? ((octHt - oct.cost) / octHt * 100).toFixed(1).replace('.', ',') : '0';
  const out = cashOut();
  return head('Tableau de bord', cap(new Date(TODAY + 'T12:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })) + (VAT() ? ' · montants TTC' : '')) +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">' +
      tile('Chiffre d’affaires du jour', fmt(ca), day.count + ' ventes · panier moyen ' + fmt(ca / day.count)) +
      tile(cap(MN[1] || '') + ' ' + (S.db.monthKeys[1] || '').slice(0, 4), fmt(oct.ttc), (growth >= 0 ? '+' : '−') + Math.abs(growth) + ' % par rapport à ' + (MN[0] || '')) +
      (seeCost() ? tile('Marge brute de ' + (MN[1] || ''), oct.cost ? margin + ' %' : '—', 'sur le coût moyen pondéré (PMP)') : '') +
      tile('Impayés clients', fmt(imp), lateClients + ' client(s) avec des factures en retard') +
    '</div>' +
    '<div class="grid-auto">' +
      '<section class="card card-pad"><h2>Ventes du jour par vendeur</h2>' + sellers.map((s) => '<div title="' + esc(s.u.name + ' : ' + fmt(s.v[0]) + ' en ' + s.v[1] + ' ventes') + '" style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;font-size:14px"><b>' + esc(s.u.name) + '</b><span class="num">' + fmt(s.v[0]) + ' <span class="muted">· ' + s.v[1] + ' ventes</span></span></div><div style="height:12px;background:#F0F0EC;border-radius:4px" aria-hidden="true"><div style="height:12px;width:' + Math.round(s.v[0] / max * 100) + '%;background:var(--accent);border-radius:0 4px 4px 0"></div></div></div>').join('') + '</section>' +
      '<section class="card card-pad"><h2>Point de caisse</h2><table class="t num"><thead><tr><th>Mode</th><th class="right">Encaissé</th></tr></thead><tbody><tr><td>Espèces</td><td class="right">' + fmt(day.cash) + '</td></tr><tr><td>Chèques</td><td class="right">' + fmt(day.cheque) + '</td></tr><tr><td>Virements</td><td class="right">' + fmt(day.virement) + '</td></tr><tr><td><b>Total</b></td><td class="right"><b>' + fmt(day.cash + day.cheque + day.virement) + '</b></td></tr></tbody></table>' +
        '<div class="alert a-info">Espèces attendues en caisse : <b>' + fmt(drawerCash()) + '</b>' + (S.db.session ? ' (session ' + S.db.session.ref + ', fond ' + fmt(S.db.session.opening) + ' inclus' + (out ? ', ' + fmt(out) + ' déposés en banque aujourd’hui' : '') + ')' : ' (caisse fermée)') + '</div><button class="btn btn-dark" type="button" data-action="modalCashClose">' + (S.db.session ? 'Compter et fermer la caisse' : 'Compter la caisse') + '</button></section>' +
      '<section class="card card-pad"><h2>À vérifier</h2>' +
        (S.db.journal.length ? S.db.journal.map((j) => '<div class="alert a-warn">' + ic('warn', 20, '#9A3412') + '<div><b>Attention :</b> vente ' + j.sale + ' interrompue sur le poste ' + esc(j.device) + ' (étape « ' + STEP_LABEL[j.step] + ' », ' + j.invoice + ', ' + fmt(j.ttc) + '). <a href="#/ventes/' + j.invoice + '">Voir</a></div></div>').join('') : '<div class="alert a-ok">' + ic('check', 20) + 'Aucune vente interrompue.</div>') +
        (priced.length ? '<div class="alert a-info">' + ic('info', 20) + '<div>' + priced.reduce((t, d) => t + d.notePrivate.length, 0) + ' prix modifié(s) à la caisse aujourd’hui : ' + priced.map((d) => '<a class="mono" href="#/ventes/' + d.ref + '">' + d.ref + '</a>').join(', ') + '</div></div>' : '') +
        (day.orphans ? '<div class="alert" style="background:var(--bg)">' + ic('info', 20) + '<div style="display:flex;flex-direction:column;gap:8px"><span><b>Info :</b> ' + day.orphans + ' factures brouillon CARUNO de plus de 24 h, sans vente en cours. Sans effet sur le stock.</span><button class="btn btn-outline" type="button" data-action="cleanOrphans" style="align-self:flex-start">Examiner et supprimer</button></div></div>' : '') +
        (chq.length ? '<div class="alert a-info">' + ic('info', 20) + '<div>' + chq.length + ' chèque(s) à remettre en banque, ' + fmt(chq.reduce((t, p) => t + p.amount, 0)) + '. <a href="#/reglements" data-action="regTab" data-arg="cheques">Règlements</a></div></div>' : '') +
        '<div class="alert a-warn">' + ic('warn', 20, '#9A3412') + '<div>' + alerts.length + ' pièces sous le seuil d’alerte. <a href="#/stock">Voir le stock</a></div></div>' +
      '</section>' +
    '</div>';
}
function viewReglements() {
  const tab = S.ui.regTab || 'paiements';
  DOLI.need('payments', () => DOLI.loadDocPayments(S.db.docs));
  DOLI.need('day', () => DOLI.loadDayPayments());
  const all = payments();
  const cheques = all.filter((p) => p.mode === 'cheque' && p.amount > 0 && !p.deposited);
  const sel = S.ui.chkSel || (S.ui.chkSel = {});
  const caisse = drawerCash();
  const banque = S.db.bank.opening; // solde du compte banque lu dans Dolibarr
  const tile = (l, v, s) => '<div class="card kpi"><span class="l">' + l + '</span><span class="v num">' + v + '</span><span class="s">' + s + '</span></div>';
  const amount = (a) => '<span style="font-weight:600;color:' + (a < 0 ? 'var(--bad)' : 'inherit') + '">' + (a < 0 ? '−' : '') + fmt(Math.abs(a)) + '</span>';
  let body;
  if (tab === 'paiements') {
    const f = S.ui.regMode || '';
    const list = all.filter((p) => !f || p.mode === f);
    body = '<div class="toolbar"><label class="sr" for="reg-mode">Mode</label><select id="reg-mode" data-change="regMode"><option value="">Tous les modes</option>' + ['especes', 'cheque', 'virement', 'avoir'].map((k) => '<option value="' + k + '"' + (f === k ? ' selected' : '') + '>' + MODES[k] + '</option>').join('') + '</select></div>' +
      '<div class="card" style="overflow:hidden"><div class="table-wrap"><table class="t" style="min-width:760px"><thead><tr><th>Date</th><th>Document</th><th>Client</th><th>Mode</th><th class="right">Montant</th></tr></thead><tbody>' +
      (list.length ? list.map((p) => '<tr><td class="num">' + dateFr(p.date) + '</td><td><a class="mono" href="#/ventes/' + p.doc.ref + '">' + p.doc.ref + '</a></td><td>' + esc(client(p.doc.client).name) + '</td><td>' + esc(MODES[p.mode] || p.mode) + (p.label ? ' <span class="mono muted">' + esc(p.label) + '</span>' : '') + (p.mode === 'cheque' && p.amount > 0 ? ' ' + (p.deposited ? '<span class="badge b-grey">Remis · ' + esc(p.depositRef) + '</span>' : '<span class="badge b-warn">À remettre</span>') : '') + '</td><td class="right num">' + amount(p.amount) + '</td></tr>').join('') : '<tr><td colspan="5" class="empty">Aucun paiement.</td></tr>') +
      '</tbody></table></div></div>';
  } else if (tab === 'cheques') {
    const picked = cheques.filter((p) => sel[p.key]);
    body = '<div class="card" style="overflow:hidden"><div class="card-head"><h2>' + cheques.length + ' chèque(s) à remettre en banque</h2><button class="btn btn-primary" type="button" data-action="chkDeposit"' + (picked.length ? '' : ' disabled') + '>Créer le bordereau (' + picked.length + ' · ' + fmt(picked.reduce((t, p) => t + p.amount, 0)) + ')</button></div>' +
      '<div class="table-wrap"><table class="t" style="min-width:640px"><thead><tr><th><span class="sr">Choisir</span></th><th>Date</th><th>Facture</th><th>Client</th><th class="right">Montant</th></tr></thead><tbody>' +
      (cheques.length ? cheques.map((p) => '<tr><td><input type="checkbox" id="chk-' + esc(p.key) + '" data-change="chkSel" data-arg="' + esc(p.key) + '"' + (sel[p.key] ? ' checked' : '') + ' style="width:20px;height:20px" aria-label="Chèque ' + esc(p.doc.ref) + '"></td><td class="num">' + dateFr(p.date) + '</td><td><a class="mono" href="#/ventes/' + p.doc.ref + '">' + p.doc.ref + '</a></td><td>' + esc(client(p.doc.client).name) + '</td><td class="right num"><b>' + fmt(p.amount) + '</b></td></tr>').join('') : '<tr><td colspan="5" class="empty">Aucun chèque en attente.</td></tr>') +
      '</tbody></table></div></div>' +
      '<div class="card" style="overflow:hidden"><div class="card-head"><h2>Bordereaux de remise</h2></div><div class="table-wrap"><table class="t" style="min-width:480px"><thead><tr><th>Bordereau</th><th>Date</th><th class="right">Chèques</th><th class="right">Montant</th></tr></thead><tbody>' +
      S.db.bank.deposits.map((x) => '<tr><td class="mono">' + x.ref + '</td><td class="num">' + dateFr(x.date) + '</td><td class="right num">' + x.count + '</td><td class="right num">' + fmt(x.amount) + '</td></tr>').join('') + '</tbody></table></div></div>';
  } else {
    const ops = [].concat(
      all.filter((p) => p.mode === 'virement').map((p) => ({ date: p.date, label: 'Virement reçu · ' + p.doc.ref + ' · ' + client(p.doc.client).name, amount: p.amount })),
      S.db.bank.deposits.map((x) => ({ date: x.date, label: 'Remise de chèques ' + x.ref + ' (' + x.count + ' chèques)', amount: x.amount })),
      S.db.bank.transfers.map((x) => ({ date: x.date, label: 'Dépôt d’espèces de la caisse', amount: x.amount }))
    ).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
    body = '<div class="card" style="overflow:hidden"><div class="table-wrap"><table class="t" style="min-width:560px"><thead><tr><th>Date</th><th>Opération</th><th class="right">Montant</th></tr></thead><tbody>' +
      (ops.length ? ops.map((o) => '<tr><td class="num">' + dateFr(o.date) + '</td><td>' + esc(o.label) + '</td><td class="right num">' + amount(o.amount) + '</td></tr>').join('') : '<tr><td colspan="3" class="empty">Aucune opération.</td></tr>') +
      '</tbody></table></div></div>';
  }
  return head('Règlements', 'Paiements reçus, chèques et comptes du magasin', '<button class="btn" type="button" data-action="modalCashDeposit">Déposer des espèces en banque</button>') +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">' +
      tile('Caisse magasin', S.db.session ? fmt(caisse) : 'Fermée', S.db.session ? 'espèces dans le tiroir, fond inclus' : 'dernière fermeture : ' + fmt((S.db.sessions[0] || {}).counted) + ' comptés') +
      tile('Banque', fmt(banque), 'compte courant') +
      tile('Chèques à remettre', fmt(cheques.reduce((t, p) => t + p.amount, 0)), cheques.length + ' chèque(s)') +
      tile('Encaissé aujourd’hui', fmt(S.db.day.cash + S.db.day.cheque + S.db.day.virement), 'espèces, chèques et virements') +
    '</div>' +
    tabs([['paiements', 'Paiements reçus'], ['cheques', 'Chèques à remettre (' + cheques.length + ')'], ['banque', 'Opérations bancaires']], tab, 'regTab') + body;
}

function renderModal() {
  const m = S.ui.modal;
  if (!m) return '';
  const cancel = '<button class="btn" type="button" data-action="closeModal">Annuler</button>';
  if (m.kind === 'transfer') { const p = part(m.pid);
    return modal('Transférer ' + esc(p.brand + ' ' + p.ref), '<div class="form-grid"><div class="field"><label for="m-from">De</label><select id="m-from" name="from"><option' + (p.stock['Magasin'] === 0 ? '' : ' selected') + '>Magasin</option><option' + (p.stock['Magasin'] === 0 ? ' selected' : '') + '>Réserve</option></select></div><div class="field"><label for="m-qty">Quantité</label><input class="input num" id="m-qty" name="qty" inputmode="numeric" value="1"></div></div><span class="muted" style="font-size:14px">Stock actuel : Magasin ' + p.stock['Magasin'] + ' · Réserve ' + p.stock['Réserve'] + '</span>', cancel + '<button class="btn btn-primary" type="submit">Transférer</button>', 'mTransfer'); }
  if (m.kind === 'correct') { const p = part(m.pid);
    return modal('Corriger le stock', '<div class="form-grid"><div class="field"><label for="m-wh">Entrepôt</label><select id="m-wh" name="wh">' + WAREHOUSES.map((w) => '<option>' + w + '</option>').join('') + '</select></div><div class="field"><label for="m-real">Quantité réelle</label><input class="input num" id="m-real" name="real" inputmode="numeric" value="' + p.stock['Magasin'] + '"></div></div><div class="field"><label for="m-why">Motif</label><select id="m-why" name="why"><option>Inventaire</option><option>Casse</option><option>Perte</option><option>Erreur de saisie</option></select></div>', cancel + '<button class="btn btn-primary" type="submit">Corriger</button>', 'mCorrect'); }
  if (m.kind === 'label') { const p = part(m.pid);

function route() {
  const h = (location.hash || '').replace(/^#\/?/, '');
  const [path, query] = h.split('?');
  return { parts: path.split('/').filter(Boolean), query };
}
function render() {
  const a = document.activeElement, focusId = a && a.id, sel = a && typeof a.selectionStart === 'number' ? a.selectionStart : null;
  const app = document.getElementById('app');

  if (!S.ready) { app.innerHTML = viewLoading(); return; }
  const r = route(), p = r.parts, sec = p[0] || HOME[role()];
  if (!p[0]) { location.replace('#/' + sec); return; }
  // Au démarrage et à la connexion, le poste propose les ventes restées dans son journal.
  if (!S.ui.resumeAsked) { S.ui.resumeAsked = true; if (S.db.journal.length && can(['vendeur', 'responsable', 'gerant']) && !S.ui.modal) S.ui.modal = { kind: 'resume' }; }
  const navItem = NAV.find((n) => n.id === sec);
  let html;
  if (navItem && navItem.roles.indexOf(role()) === -1) html = denied();
  else if (sec === 'caisse') html = viewPos();
  else if (sec === 'pieces') html = p[1] === 'nouveau' ? viewPieceForm(null) : p[2] === 'modifier' ? viewPieceForm(p[1]) : p[1] ? viewPiece(p[1]) : viewPieces();
  else if (sec === 'catalogue') html = p[1] ? viewCatPiece(p[1]) : viewCatalogue();
  else if (sec === 'stock') html = viewStock();
  else if (sec === 'clients') html = p[1] === 'nouveau' ? viewClientForm(null) : p[2] === 'modifier' ? viewClientForm(p[1]) : p[1] ? viewClient(p[1]) : viewClients();
  else if (sec === 'ventes') html = p[1] === 'nouveau' ? viewDocEditor(p[2] || 'devis', r.query) : p[1] ? viewDoc(p[1]) : viewVentes();
  else if (sec === 'achats') html = p[1] === 'nouveau' ? viewPOEditor() : p[1] ? viewPO(p[1]) : viewAchats();
  else if (sec === 'reglements') html = viewReglements();
  else if (sec === 'scanner') html = viewScanner();
  else if (sec === 'tableau') html = viewTableau();
  else if (sec === 'utilisateurs') html = p[1] === 'nouveau' ? viewUserForm() : viewUsers();
  else if (sec === 'profil') html = viewProfil();
  else html = head('Page introuvable', '', '<a class="btn" href="#/' + HOME[role()] + '">Accueil</a>');
  // La caisse s'affiche en plein écran, sans le menu du back-office.
  const fullScreen = sec === 'caisse' && navItem.roles.indexOf(role()) !== -1;
  app.innerHTML = (fullScreen ? html : shell(sec, html)) + renderModal() + (S.ui.toast ? '<div class="toast" role="status">' + esc(S.ui.toast) + '</div>' : '');
  document.title = 'CARUNO — ' + (navItem ? navItem.label : sec.charAt(0).toUpperCase() + sec.slice(1));
  if (focusId) { const el = document.getElementById(focusId); if (el) { render.restoring = true; el.focus(); render.restoring = false; if (sel !== null && el.setSelectionRange) { try { el.setSelectionRange(sel, sel); } catch (e) {} } } }
  // Caisse au clavier (PC) : champ demandé par une action, sinon la recherche garde le curseur.
  const wanted = S.ui.focus && document.getElementById(S.ui.focus);
  S.ui.focus = null;
  if (wanted) { wanted.focus(); if (wanted.select) wanted.select(); }
  else if (fullScreen && posUi().screen === 'products' && !S.ui.modal && window.matchMedia('(min-width: 901px)').matches) {
    const a = document.activeElement;
    if (!a || a === document.body || (!a.id && a.tagName === 'BUTTON')) { const q = document.getElementById('pos-q'); if (q) q.focus(); }
  }
}
let lastHash = '';
window.addEventListener('hashchange', () => {

// Validation : la sortie de stock dépend du mode du magasin (facture, ou commande + expédition).
function validateSale(d, steps) {
  const short = d.lines.find((l) => part(l.pid).stock['Magasin'] < l.qty);
  if (short) { toast('Stock Magasin insuffisant pour ' + part(short.pid).brand + ' ' + part(short.pid).ref + ' : validation refusée.'); return false; }
  if (stockMode() === 'shipment') {
    const co = nextRef('CO'), sh = nextRef('SH');
    S.db.docs.push({ ref: co, type: 'commande', client: d.client, date: TODAY, status: 'facturee', ttc: d.ttc, desc: 'Vente comptoir ' + d.saleRef, saleRef: d.saleRef, lines: d.lines.map((l) => Object.assign({ shipped: l.qty }, l)) });
    S.db.docs.push({ ref: sh, type: 'livraison', client: d.client, date: TODAY, status: 'facturee', ttc: d.ttc, desc: 'Vente comptoir ' + d.saleRef, saleRef: d.saleRef, lines: d.lines.map((l) => Object.assign({}, l)), origin: co, stockOut: true });
    d.origins = [sh];
    d.lines.forEach((l) => move(l.pid, 'Expédition ' + sh + ' (vente comptoir)', -l.qty, 'Magasin'));
    steps.push({ t: '2. Commande ' + co + ' et expédition ' + sh + ' validées (stock sorti du Magasin), puis facture validée' });
  } else {
    d.lines.forEach((l) => move(l.pid, 'Vente comptoir — ' + d.ref, -l.qty, 'Magasin'));
    steps.push({ t: '2. Facture validée sur l’entrepôt Magasin : stock sorti' });
  }
  d.status = 'impayee';
  addSale(d.ttc); sessAdd('count', 1); sessAdd('total', d.ttc);
  return true;
}
// Paiement : ne paie que le reste relu sur la facture, jamais deux fois.
function paySale(d, j, steps, resumed) {
  if (j.credit && !d.creditCounted) { sessAdd('credit', j.credit); d.creditCounted = true; }
  if (!j.pay.length) { steps.push({ t: '3. Vente à crédit : ' + fmt(j.credit) + ' ajoutés à l’encours du client' }); return; }
  const due = d.ttc - (d.paid || 0) - j.credit;
  if (due <= 0) { steps.push({ t: '3. Reste à payer relu : ' + fmt(d.ttc - d.paid) + '. Paiement déjà enregistré, rien n’est payé deux fois', skip: true }); return; }
  let left = due;
  j.pay.forEach((p) => { const a = Math.min(p.amount, left); if (a <= 0) return; recordPayment(d, p.mode, a); sessAdd(p.mode, a); if (p.mode === 'avoir') useCredit(d.client, a); left -= a; });
  steps.push({ t: '3. ' + (resumed ? 'Reste à payer relu : ' + fmt(due) + '. ' : '') + 'Paiement ' + j.pay.map((p) => MODES[p.mode].toLowerCase() + ' ' + fmt(p.amount)).join(' + ') + ' enregistré' + (j.credit ? ', ' + fmt(j.credit) + ' à crédit' : '') });
}
function cutOff(j) {
  const u = posUi(); u.cutOff = j.sale; u.done = null; u.screen = 'receipt'; save();
  toast('Connexion perdue : la vente ' + j.sale + ' reste dans le journal du poste.');
}
// Reprise d'une vente du journal : chaque étape relit l'état avant d'écrire.
function resume(sale) {
  const j = S.db.journal.find((x) => x.sale === sale);
  if (!j) return null;
  const steps = [];
  let d = S.db.docs.find((x) => x.type === 'facture' && x.saleRef === j.sale);
  if (d) steps.push({ t: '1. Facture ' + d.ref + ' retrouvée par sa référence externe ' + j.sale + ' : réutilisée, pas de doublon', skip: true });
  else { d = draftSale(j); steps.push({ t: '1. Aucune facture ' + j.sale + ' dans Dolibarr : facture ' + d.ref + ' créée' }); }
  if (d.status === 'brouillon') { if (!validateSale(d, steps)) return null; }
  else steps.push({ t: '2. Facture déjà validée : pas de seconde validation, le stock n’est sorti qu’une fois', skip: true });
  paySale(d, j, steps, true);
  S.db.journal = S.db.journal.filter((x) => x !== j);
  d.steps = steps; save();
  return d;
}
// Facture validée à crédit depuis des commandes ou livraisons. Mode facture : le stock sort ici.
function invoiceFrom(cid, lines, origins, desc) {
  const bill = stockMode() === 'bill', c = client(cid);
  if (bill) {
    const need = {}; lines.forEach((l) => { need[l.pid] = (need[l.pid] || 0) + l.qty; });
    const short = Object.keys(need).find((pid) => part(pid).stock['Magasin'] < need[pid]);
    if (short) { const p = part(short); toast('Stock Magasin insuffisant pour ' + p.brand + ' ' + p.ref + ' : facture refusée (stock négatif interdit).'); return null; }
  }
  const T = totals(lines);
  const fa = { ref: nextRef('FA'), type: 'facture', client: cid, date: TODAY, due: '2026-12-01', status: 'impayee', ttc: T.ttc, paid: 0, desc, lines: lines.map((l) => ({ pid: l.pid, qty: l.qty, price: l.price })), origins, payments: [] };
  S.db.docs.push(fa);
  if (bill) fa.lines.forEach((l) => move(l.pid, 'Facture ' + fa.ref + ' (' + c.name + ')', -l.qty, 'Magasin'));
  addSale(T.ttc);
  return fa;
}

function compress(file) {
  return new Promise((resolve) => {
    if (!file) return resolve(null);
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, 1280 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const url = c.toDataURL('image/jpeg', 0.72); resolve({ url, kb: Math.round(url.length * 0.75 / 1024) }); }; img.onerror = () => resolve(null); img.src = r.result; };
    r.onerror = () => resolve(null);
    r.readAsDataURL(file);
  });
}

// Raccourcis clavier de la caisse (PC). Renvoie true si la touche a été traitée.
//   Recherche : ↑ ↓ choisissent la pièce ; recherche vide, ↑ ↓ vont au prix de la ligne précédente / suivante. Échap efface.
//   Prix : Entrée passe à la quantité, ↑ ↓ au prix de la ligne précédente / suivante, Échap revient à la recherche.
//   Quantité : Entrée revient à la recherche, ↑ ↓ ajoutent / retirent une pièce. (F2 / F4 restent en raccourci vers prix / quantité.)
//   Paiement : Échap revient aux pièces. Ticket : Entrée lance la commande suivante.
function posKeys(ev, el) {
  if (S.ui.modal || !S.user || !S.db.session || !/^#\/caisse/.test(location.hash)) return false;
  const u = posUi(), o = curOrder(), id = el.id || '', k = ev.key;
  const done = (fn) => { ev.preventDefault(); fn(); render(); return true; };
  if (u.screen === 'products') {
    if ((k === 'F2' || k === 'F4') && o.lines[o.sel]) return done(() => focusNext((k === 'F2' ? 'ln-price-' : 'ln-qty-') + o.sel));
    if (id === 'pos-q') {
      if (k === 'ArrowDown' || k === 'ArrowUp') {
        const d = k === 'ArrowDown' ? 1 : -1;
        return done(() => {
          if (u.q) { u.hi = Math.max(0, Math.min(posResults().length - 1, (u.hi || 0) + d)); focusNext('pos-q'); }
          else if (o.lines.length) { o.sel = Math.max(0, Math.min(o.lines.length - 1, (o.sel < 0 ? (d > 0 ? -1 : o.lines.length) : o.sel) + d)); u.edit = null; focusNext('ln-price-' + o.sel); }
        });
      }
      if (k === 'Escape') return done(() => { u.q = ''; u.hi = 0; focusNext('pos-q'); });
    }
    if (/^ln-qty-/.test(id)) {
      const i = Number(id.slice(7));
      if (k === 'Enter' || k === 'Escape') return done(() => { u.edit = null; save(); focusNext('pos-q'); });
      if (k === 'ArrowUp' || k === 'ArrowDown') return done(() => { A.lineQty({ dataset: { arg: i + ':' + (k === 'ArrowUp' ? 1 : -1) } }); focusNext('ln-qty-' + i); });
    }
    if (/^ln-price-/.test(id)) {
      const i = Number(id.slice(9));
      if (k === 'Enter') return done(() => { u.edit = null; save(); focusNext('ln-qty-' + i); });
      if (k === 'Escape') return done(() => { u.edit = null; save(); focusNext('pos-q'); });
      if (k === 'ArrowUp' || k === 'ArrowDown') return done(() => { u.edit = null; save(); o.sel = Math.max(0, Math.min(o.lines.length - 1, i + (k === 'ArrowDown' ? 1 : -1))); focusNext('ln-price-' + o.sel); });
    }
  }
  if (u.screen === 'payment' && k === 'Escape') return done(() => { u.screen = 'products'; u.edit = null; focusNext('pos-q'); });
  if (u.screen === 'receipt' && k === 'Enter' && !/INPUT|BUTTON|SELECT|TEXTAREA/.test(el.tagName || '')) return done(() => A.posNext());
  return false;
}

/* =================================================================== DOLIBARR : actions écrites dans Dolibarr
   Remplace les actions de la maquette qui modifiaient les données de test. Chaque écriture passe par l'API,
   puis les données concernées sont relues dans Dolibarr. */
// Action asynchrone : message d'attente, erreur lisible ; session expirée → retour à la connexion.
async function run(fn, wait) {
  if (S.ui.busy) return;
  S.ui.busy = wait || '…';
  if (wait) toast(wait);
  render();
  try { await fn(); }
  catch (e) {
    if (DOLI.expired) { A.logout(); toast('Session Dolibarr expirée : reconnectez-vous.'); }
    else toast(e && e.message ? e.message : String(e));
  } finally {
    // Le message d'attente disparaît dès la fin (un message de résultat a pu le remplacer).
    if (wait && S.ui.toast === wait) S.ui.toast = '';
    S.ui.busy = ''; render();
  }
}

// ----- connexion, chargement
async function boot() {
  if (S.user && S.user.token) {
    DOLI.url = S.user.url; DOLI.token = S.user.token; S.ready = false; S.ui.loadErr = ''; render();
    try {
      const me = await DOLI.whoami();
      S.user.role = me.role; S.user.name = me.name; saveUser();
      await DOLI.loadAll();
      S.ready = true;
    } catch (e) {
      if (e.status === 401) { S.user = null; saveUser(); S.ui.login = null; }
      else S.ui.loadErr = e.message;
    }
  }
  render();
}
A.reload = () => { boot(); return false; };
F.login = (form, fd) => {
  const L = S.ui.login, url = String(fd.get('url') || '').trim(), login = String(fd.get('login') || '').trim(), pw = String(fd.get('password') || '');
  L.url = url; L.login = login; L.err = '';
  const host = url.replace(/^https?:\/\//i, '').split(/[/?#]/)[0];
  if (!host || /\s/.test(url) || !(/[.:]/.test(host) || /^localhost$/i.test(host))) { L.err = 'Ce n’est pas une adresse web : mettez l’adresse du Dolibarr (ex. http://localhost:8080).'; return; }
  L.busy = true;
  (async () => {
    try {
      await DOLI.login(url, login, pw);
      const me = await DOLI.whoami();
      try { localStorage.setItem('caruno-url', url); } catch (e) {}
      S.user = { login: me.login, name: me.name, role: me.role, url, token: DOLI.token }; saveUser();
      L.busy = false; S.ready = false; S.ui.loadErr = ''; render();
      await DOLI.loadAll();
      S.ready = true; S.ui.resumeAsked = false; S.ui.cat = null;
      location.hash = '#/' + HOME[me.role];
    } catch (e) {
      L.busy = false;
      if (S.user && !S.ready) S.ui.loadErr = e.message; else L.err = e.message;
    }
    render();
  })();
};

// ----- caisse : vente dans Dolibarr (facture → validation sur le Magasin → règlements)
function finishSale(j, d, steps) {
  const u = posUi();
  if (j.change) steps.push({ t: 'Rendu au client : ' + fmt(j.change) });
  d.change = j.change; d.steps = steps; if (j.note) d.note = j.note;
  if (!j.counted) { sessAdd('count', 1); sessAdd('total', d.ttc); j.pay.forEach((p) => sessAdd(p.mode, p.amount)); if (j.credit) sessAdd('credit', j.credit); j.counted = true; }
  S.db.journal = S.db.journal.filter((x) => x !== j);
  u.done = d.ref; u.cutOff = null; u.screen = 'receipt'; save();
}
A.posValidate = () => {
  const u = posUi(), o = curOrder(), T = orderTotals(o), pp = posPlan(o, T);
  if (!pp.ok) { toast(pp.msg); return; }
  if (S.ui.busy) return false;
  // Chaque prix modifié à la main part dans la note privée de la facture.
  const log = T.lines.filter((x) => x.l.price != null || x.l.disc || underCost(x)).map((x) => x.p.brand + ' ' + x.p.ref + ' : ' + fmt(x.ref) + ' → ' + fmt(x.unit) + ' (' + pctTxt(x.unit, x.ref) + ')' + (x.below ? ', sous le prix minimum' : '') + (underCost(x) ? ', sous le prix d’achat (' + fmt(costRef(x.p)) + ')' : '') + (x.l.reason ? ', motif : ' + x.l.reason : '') + ' — ' + S.user.name);
  if (!o.uid) o.uid = Math.random().toString(36).slice(2, 8).toUpperCase();
  const j = { sale: o.ref, ext: o.ref + '-' + o.uid, invoice: '', device: DEVICE, time: nowStr(), step: 'validation', client: o.client, ttc: T.ttc,
    lines: T.lines.map((x) => ({ pid: x.p.id, qty: x.l.qty, price: x.unit })), pay: pp.pay, credit: pp.credit, notePrivate: log.length ? log : undefined, note: o.note, change: pp.change };
  const idx = S.db.posOrders.indexOf(o);
  S.db.journal.push(j);
  S.db.posOrders.splice(idx, 1); S.db.posOrders.push(newOrder()); u.cur = S.db.posOrders.length - 1; save();
  run(async () => {
    const steps = [];
    try { finishSale(j, await DOLI.sale(j, steps), steps); }
    catch (e) {
      if (e.status === 0 || j.step === 'paiement') { cutOff(j); throw e; }
      // Refus de Dolibarr avant la validation : la commande revient à l'écran, rien n'est sorti du stock.
      S.db.journal = S.db.journal.filter((x) => x !== j);
      S.db.posOrders.splice(idx, 0, o); u.cur = idx; u.screen = 'payment'; save();
      throw e;
    }
  }, 'Enregistrement de la vente dans Dolibarr…');
};
A.resumeSale = (el) => {

async function moveAll(list) { for (const m of list) await DOLI.move(m[0], m[1], m[2], m[3]); await DOLI.refreshParts(list.map((m) => Number(m[0]))); }
F.transfer = () => {

  run(async () => { await moveAll([[p.id, 'Transfert ' + f.from + ' → ' + f.to, -q, f.from], [p.id, 'Transfert ' + f.from + ' → ' + f.to, q, f.to]]); toast(q + ' × ' + p.brand + ' ' + p.ref + ' transféré(s) vers ' + f.to + '.'); }, 'Transfert…');
};

// Logo réduit (240 px au plus) pour rester léger dans le profil du magasin.
function shrinkLogo(file) {
  return new Promise((ok) => {
    if (!file) return ok('');
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, 240 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/png')); }; img.onerror = () => ok(''); img.src = r.result; };
    r.onerror = () => ok('');
    r.readAsDataURL(file);
  });
}

function loadScript(src) {
  return new Promise((ok, ko) => {
    if (document.querySelector('script[src="' + src + '"]')) return ok();
    const s = document.createElement('script'); s.src = src; s.onload = () => ok(); s.onerror = () => ko(new Error('Lecteur de fichier introuvable (' + src + ').'));
    document.head.appendChild(s);

}
// Fichier → lignes de cellules. PDF : texte rangé en lignes (même hauteur) puis en colonnes (mêmes abscisses).
async function readRows(file) {
  const buf = await file.arrayBuffer();
  if (/\.pdf$/i.test(file.name) || file.type === 'application/pdf') {
    await loadScript('vendor/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise, all = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const tc = await (await pdf.getPage(i)).getTextContent();
      const items = tc.items.filter((it) => it.str && it.str.trim()).map((it) => ({ x: it.transform[4], y: it.transform[5], w: it.width, s: it.str.trim() }));
      const lines = [];
      items.forEach((it) => { const l = lines.find((x) => Math.abs(x.y - it.y) <= 2.5); if (l) l.items.push(it); else lines.push({ y: it.y, items: [it] }); });
      lines.sort((a, b) => b.y - a.y).forEach((l) => {
        l.items.sort((a, b) => a.x - b.x);
        const cells = []; let last = null;
        l.items.forEach((it) => { if (last && it.x - (last.x + last.w) < 6) cells[cells.length - 1].s += ' ' + it.s; else cells.push({ x: it.x, s: it.s }); last = it; });
        all.push(cells);
      });
    }
    const cols = [];
    all.flat().map((c) => c.x).sort((a, b) => a - b).forEach((x) => { const c = cols.find((k) => Math.abs(k.x - x) < 15); if (c) { c.n++; c.x += (x - c.x) / c.n; } else cols.push({ x, n: 1 }); });
    const keep = cols.filter((c) => c.n >= Math.max(2, all.length * 0.15)).sort((a, b) => a.x - b.x);
    if (!keep.length) return [];
    return all.map((r) => {
      const out = keep.map(() => '');
      r.forEach((c) => { let k = 0, best = Infinity; keep.forEach((col, i) => { const d = Math.abs(col.x - c.x); if (d < best) { best = d; k = i; } }); out[k] = out[k] ? out[k] + ' ' + c.s : c.s; });
      return out;
    }).filter((r) => r.filter(Boolean).length >= 2);
  }
  await loadScript('vendor/xlsx.full.min.js');
  const wb = XLSX.read(buf, { type: 'array' }), ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' }).map((r) => r.map((c) => String(c == null ? '' : c).trim())).filter((r) => r.some((c) => c));
}
const impNum = (v) => {
  let t = String(v || '').replace(/[^\d.,-]/g, '');
  if (t.indexOf(',') !== -1 && t.indexOf('.') !== -1) t = t.replace(/\./g, '').replace(',', '.'); else t = t.replace(',', '.');
  const n = parseFloat(t); return isFinite(n) ? Math.round(n) : 0;
};
function impGuess(m) {
  const head = m.header ? m.rows[0] || [] : [];
  m.map = {};
  IMP_FIELDS.forEach(([k, , , re]) => { const i = head.findIndex((h, j) => re.test(h) && !Object.values(m.map).includes(j) && !(k === 'ref' && /oem|fourn/i.test(h))); if (i !== -1) m.map[k] = i; });
  if (m.map.ref === undefined && !m.header) { m.map.ref = 0; m.map.name = 1; }
}
function impItems(m) {
  const data = m.header ? m.rows.slice(1) : m.rows, get = (r, k) => (m.map[k] === undefined ? '' : String(r[m.map[k]] || '').trim());
  return data.map((r) => ({ ref: get(r, 'ref'), name: get(r, 'name'), brand: get(r, 'brand'), oem: get(r, 'oem'), ean: get(r, 'ean'), fam: get(r, 'fam'), p0: impNum(get(r, 'p0')), p1: impNum(get(r, 'p1')), p2: impNum(get(r, 'p2')), qty: impNum(get(r, 'qty')), loc: get(r, 'loc'), seuil: impNum(get(r, 'seuil')), sprice: impNum(get(r, 'sprice')) }))
    .filter((it) => it.ref && it.name);
}

};

/* =================================================================== CAISSE : VENTE SOUS LE PRIX D'ACHAT */
// Prix de vente de la ligne sous le coût d'achat (PMP connu). Le vendeur est averti sans voir le coût ;
// les rôles qui voient les coûts ont le montant.
// Prix d'achat retenu : le plus élevé du coût moyen (PMP) et du dernier achat (protège quand le fournisseur augmente).
function costRef(p) { return Math.max(p.cost || 0, (p.lastBuy && p.lastBuy.price) || 0); }
function underCost(x) { const c = costRef(x.p); return c > 0 && x.unit < c; }
function costWarn(x) {
  if (!underCost(x)) return '';
  return '<div class="cost-warn" role="alert">' + ic('warn', 16, '#991B1B') + '<span>Prix inférieur au prix d’achat' + (seeCost() ? ' (' + fmt(costRef(x.p)) + ')' : '') + ' : vente à perte</span></div>';
}
// Fiche pièce (rôles qui voient les coûts) : dernier achat et seuil de l'alerte de la caisse.

}
function costAlert(T) {
