<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARUNO — Maquette magasin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F1;--surface:#FFFFFF;--soft:#FAFAF8;--ink:#17191E;--muted:#4B5060;--line:#DADBD6;--line2:#ECECE8;
  --dark:#17191E;--dark2:#23262E;--dark-ink:#E4E5EA;
  --accent:#C2410C;--accent-hover:#9A3412;--accent-weak:#FBEADF;--accent-ink:#7C2D12;
  --ok:#14532D;--ok-bg:#E9F6EE;--warn:#9A3412;--warn-bg:#FFF4E5;--bad:#991B1B;--bad-bg:#FDECEC;--info:#1E3A8A;--info-bg:#E8EEFC;
  --mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1D4ED8;outline-offset:2px}
h1{font-size:26px;margin:0;line-height:1.2}h2{font-size:17px;margin:0}h3{font-size:15px;margin:0}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.right{text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.ribbon{background:#FFF4E5;color:#5C2A06;font-size:13px;padding:6px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #F1C48B}
.ribbon button{background:none;border:0;text-decoration:underline;cursor:pointer;color:#5C2A06;padding:4px}
.shell{display:flex;min-height:calc(100vh - 31px)}
.side{width:236px;flex:none;background:var(--dark);color:#fff;display:flex;flex-direction:column;padding:16px 12px;gap:4px;position:sticky;top:0;height:calc(100vh - 31px);overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:4px 10px 18px}
.brand b{font-size:21px;letter-spacing:.09em}.brand span{font-size:12px;color:#C9CBD2}
.nav a{display:flex;align-items:center;gap:12px;color:var(--dark-ink);text-decoration:none;padding:0 12px;min-height:44px;border-radius:9px;font-size:15px}
.nav a:hover{background:var(--dark2);color:#fff}
.nav a[aria-current="page"]{background:var(--accent);color:#fff;font-weight:600}
.nav svg{flex:none}
.side .me{margin-top:auto;border-top:1px solid #33363F;padding:12px 10px 0;display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.avatar{width:36px;height:36px;border-radius:50%;background:#3A3E48;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.content{width:100%;max-width:1480px;margin:0 auto;padding:22px;display:flex;flex-direction:column;gap:18px}
.bottomnav{display:none}
.drawer-bg{display:none}
@media (max-width:900px){
  .side{display:none}
  .side.open{display:flex;position:fixed;z-index:40;left:0;top:0;height:100vh}
  .drawer-bg.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:39}
  .topbar{display:flex;align-items:center;gap:10px;background:var(--dark);color:#fff;padding:8px 12px;position:sticky;top:0;z-index:20}
  .topbar b{letter-spacing:.08em;font-size:18px}
  .topbar .icon-btn{background:var(--dark2);color:#fff;border:0}
  .content{padding:14px 14px 96px}
  .bottomnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:20;padding:4px 4px 10px}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;font-size:11px;color:var(--muted);text-decoration:none}
  .bottomnav a[aria-current="page"]{color:var(--accent);font-weight:700}
  h1{font-size:22px}
}

/* components */
.page-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.page-head .sub{font-size:14px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#B9BAB3;color:var(--ink)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff}
.btn-dark{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:600}
.btn-dark:hover{background:#000;color:#fff}
.btn-outline{border-color:var(--ink);font-weight:600}
.btn-lg{min-height:54px;font-size:17px;font-weight:700;border-radius:12px}
.btn:disabled{background:#E4E4DF;border-color:#E4E4DF;color:var(--muted);cursor:not-allowed}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.card-pad{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;align-items:start}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-info{background:var(--info-bg);color:var(--info)}.b-grey{background:#ECECE8;color:#3D414C}.b-accent{background:var(--accent-weak);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #CFD0CA;background:#fff;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{min-height:46px;padding:0 14px;border:0;background:none;cursor:pointer;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 280px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #CFD0CA;border-radius:10px;padding:0 12px;min-height:46px}
.search input{border:0;outline:none;flex:1 1 auto;min-width:0;background:transparent;font-size:15px;height:44px}
.search.big{border:2px solid var(--ink);min-height:56px;border-radius:12px}
.search.big input{font-size:17px}
select,.input,textarea{min-height:44px;border:1px solid #CFD0CA;border-radius:10px;background:#fff;padding:0 12px;font-size:15px}
textarea{padding:10px 12px;min-height:88px;resize:vertical}
.input.num{text-align:right}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:600;color:#3D414C}
.field .hint{font-size:12px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 16px}
.form-section{display:flex;flex-direction:column;gap:12px}
.form-section h2{padding-bottom:8px;border-bottom:1px solid var(--line2)}
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#FBFBF9}
table.t td a.rowlink{color:var(--ink);text-decoration:none;font-weight:600}
table.t td a.rowlink:hover{text-decoration:underline}
.thumb{width:44px;height:44px;border-radius:8px;background:#EEEEEA;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.cellpart{display:flex;align-items:center;gap:12px}
.cellpart .t1{font-weight:600}.cellpart .t2{font-size:13px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.kpi{display:flex;flex-direction:column;gap:6px;padding:16px 18px}
.kpi .v{font-size:28px;font-weight:700;line-height:1.1}
.kpi .l{font-size:14px;color:var(--muted)}.kpi .s{font-size:13px;color:var(--muted)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:14px}
.alert svg{flex:none;margin-top:1px}
.a-warn{background:var(--warn-bg);color:#5C2A06}.a-info{background:var(--info-bg);color:var(--info)}.a-ok{background:var(--ok-bg);color:var(--ok)}.a-bad{background:var(--bad-bg);color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.meter{height:12px;border-radius:999px;background:#ECECE8;overflow:hidden}.meter>div{height:100%;border-radius:999px}
.qty{display:inline-flex;align-items:center;border:1px solid #CFD0CA;border-radius:10px;background:#fff}
.qty button{width:42px;height:42px;border:0;background:none;font-size:20px;cursor:pointer}
.qty span{min-width:26px;text-align:center;font-weight:600}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.photo{position:relative;aspect-ratio:1;border-radius:10px;background:#EEEEEA;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);text-align:center;border:2px solid transparent}
.photo.main{border-color:var(--accent)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .tag{position:absolute;left:4px;top:4px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px}
.photo .ops{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(23,25,30,.75)}
.photo .ops button{flex:1;border:0;background:none;color:#fff;font-size:11px;min-height:28px;cursor:pointer}
.photo-add{border:2px dashed #8A8F9C;background:#fff;cursor:pointer;color:var(--ink);font-weight:600;flex-direction:column;gap:4px}
.photo-add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.big-photo{aspect-ratio:4/3;border-radius:12px;background:#EEEEEA;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--muted);overflow:hidden}
.big-photo img{width:100%;height:100%;object-fit:contain;background:#fff}
.bars{height:58px;background:repeating-linear-gradient(90deg,#000 0 2px,#fff 2px 4px,#000 4px 5px,#fff 5px 8px,#000 8px 11px,#fff 11px 12px)}
.label-prev{width:300px;max-width:100%;border:1px dashed #8A8F9C;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:60;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;max-width:min(560px,calc(100vw - 32px));box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (max-width:900px){.toast{bottom:84px}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.cam{position:relative;border-radius:18px;background:#2B2F38;min-height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cam .frame{width:min(280px,80%);height:140px;border:3px solid #fff;border-radius:14px;display:flex;align-items:center;justify-content:center}
.cam .beam{width:88%;height:3px;border-radius:2px;background:var(--accent)}
.cam .beam.ok{background:#22C55E}
.cam .hint{position:absolute;top:12px;left:0;right:0;text-align:center;color:#E4E5EA;font-size:14px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--dark)}
.login .box{width:min(440px,100%);display:flex;flex-direction:column;gap:22px;color:#fff}
.login .acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.login .acc button{min-height:56px;border-radius:12px;border:1px solid #4A4E59;background:var(--dark2);color:#fff;text-align:left;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.login .acc button[aria-pressed="true"]{border:2px solid var(--accent);background:#2E1E16}
.login .acc small{color:#C9CBD2;font-size:12px}
.login input{background:var(--dark2);border-color:#4A4E59;color:#fff}
.login label{color:var(--dark-ink)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================================================================
   CARUNO — maquette autonome du front magasin de pièces auto.
   Données de test fictives, gardées dans le navigateur (localStorage).
   Rien n'est envoyé à Dolibarr.
   =================================================================== */
'use strict';
const KEY = 'caruno-maquette-v1';
const TODAY = '2026-11-01';
const STOCK_MODE = 'bill'; // profil magasin : bill | shipment
const LEVELS = ['Public', 'Garage', 'Revendeur'];
const CAT_LEVEL = { Particulier: 0, Garage: 1, Revendeur: 2 };
const FAMILIES = ['Moteur', 'Filtration', 'Freinage', 'Embrayage et transmission', 'Suspension et direction', 'Électricité et électronique', 'Refroidissement et climatisation', 'Carrosserie et accessoires'];
const WAREHOUSES = ['Magasin', 'Réserve'];
const ROLES = { vendeur: 'Vendeur', magasinier: 'Magasinier', comptable: 'Comptable', responsable: 'Responsable', gerant: 'Gérant' };
const SEE_COST = ['gerant', 'responsable', 'comptable'];
const EDIT_PARTS = ['magasinier', 'responsable', 'gerant'];
const BELOW_FLOOR = ['gerant'];

/* ---------- icons ---------- */
const P = {
  caisse: '<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/>',
  pieces: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/>',
  stock: '<path d="M3 21V8l9-5 9 5v13"/><path d="M7 21v-8h10v8"/><path d="M7 17h10"/>',

  more: '<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>'
};
function ic(name, size, color) {
  return '<svg aria-hidden="true" width="' + (size || 20) + '" height="' + (size || 20) + '" viewBox="0 0 24 24" fill="none" stroke="' + (color || 'currentColor') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + P[name] + '</svg>';
}

/* ---------- seed data ---------- */
function seed() {
  const part = (id, name, brand, ref, oem, ean, fam, type, mag, res, locM, locR, prices, floor, cost, seuil, souhaite, sups) => ({

  return {
    parts: [
      part(1, 'Filtre à huile', 'MANN-FILTER', 'HU 6002 z', '03L115562', '4011558041516', 'Filtration', 'filtre-huile', 14, 30, 'A2-04', 'R-11', [1850, 1600, 1450], 1300, 1100, 10, 40, [{ sid: 's1', ref: 'DA-HU6002Z', price: 1100, delay: 2 }]),
      part(2, 'Filtre à huile', 'BOSCH', '1 457 429 192', '03L115562', '4047024393416', 'Filtration', 'filtre-huile', 6, 0, 'A2-05', 'R-11', [1700, 1480, 1350], 1200, 980, 6, 20, [{ sid: 's2', ref: 'PAO-1457429192', price: 980, delay: 5 }]),
      part(3, 'Filtre à huile', 'PURFLUX', 'L358A', '03L115562', '3286061234567', 'Filtration', 'filtre-huile', 0, 12, 'A2-06', 'R-12', [1550, 1350, 1250], 1100, 900, 6, 20, [{ sid: 's1', ref: 'DA-L358A', price: 900, delay: 2 }]),
      part(4, 'Plaquettes de frein avant', 'TRW', 'GDB2042', '5Q0698151', '3322938380541', 'Freinage', 'plaquettes-frein-avant', 8, 4, 'B1-12', 'R-03', [6900, 6200, 5700], 5200, 4300, 5, 16, [{ sid: 's1', ref: 'DA-TRW-2042', price: 4300, delay: 2 }, { sid: 's2', ref: 'PAO-GDB2042', price: 4450, delay: 5 }]),

  const banner = pending ? '<div class="alert a-warn" role="status">' + ic('warn', 20, '#9A3412') + '<div style="flex:1 1 auto"><strong>Vente ' + pending.pendingSale + ' interrompue</strong> sur le poste Comptoir 2 : facture ' + pending.ref + ' validée (stock déjà sorti), encaissement non enregistré, reste ' + fmt(pending.ttc - pending.paid) + '.</div><button class="btn btn-dark" type="button" data-action="resumeSale" data-arg="' + pending.ref + '">Reprendre l’encaissement</button></div>' : '';

  const left = '<section aria-label="Recherche de pièces" style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:14px">' +
    '<div class="toolbar"><label class="search big" for="caisse-q">' + ic('search', 22, '#4B5060') + '<span class="sr">Rechercher une pièce</span><input id="caisse-q" type="search" autocomplete="off" placeholder="Référence, OEM, marque, désignation… ou douchette" value="' + esc(st.q) + '" data-input="caisseQ" data-enter="caisseEnter"></label>' +
    '<button class="btn" type="button" data-action="caisseScan" style="min-height:56px">' + ic('scanner', 22) + 'Simuler un scan</button></div>' +
    '<div class="chips" role="group" aria-label="Familles">' + famList.map((f) => '<button class="chip" type="button" data-action="caisseFam" data-arg="' + esc(f) + '" aria-pressed="' + (st.fam === f) + '">' + esc(f.split(' et ')[0]) + '</button>').join('') + '</div>' +
    (oemHits.length > 1 ? '<div class="card card-pad" style="flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:12px 14px"><strong>Équivalences OEM</strong><span class="mono" style="background:#F0F0EC;padding:2px 8px;border-radius:6px">' + esc(oemHits[0].oem) + '</span><span class="muted" style="font-size:14px">' + oemHits.length + ' marques pour la même pièce, ' + oemHits.filter((p) => p.stock['Magasin'] > 0).length + ' disponibles au magasin</span></div>' : '') +
    '<div class="card" style="overflow:hidden"><div class="card-head"><strong>' + res.length + ' pièce' + (res.length > 1 ? 's' : '') + '</strong><span class="muted" style="font-size:13px">Prix HT · niveau <b style="color:var(--ink)">' + LEVELS[T.L] + '</b></span></div>' +
    '<div class="table-wrap"><table class="t" style="min-width:' + (seeCost() ? 700 : 620) + 'px"><thead><tr><th>Pièce</th><th>Réf. / OEM</th><th>Stock</th>' + (seeCost() ? '<th class="right">Coût PMP</th>' : '') + '<th class="right">Prix</th><th class="right"><span class="sr">Action</span></th></tr></thead><tbody>' +
    (res.length ? res.map((p) => {
      const off = p.stock['Magasin'] === 0;
      return '<tr><td><div class="cellpart">' + thumb(p) + '<div><a class="rowlink" href="#/pieces/' + p.id + '">' + esc(p.name) + '</a><div class="t2">' + esc(p.brand) + ' · ' + esc(p.fam) + '</div></div></div></td>' +
        '<td><div class="mono">' + esc(p.ref) + '</div><div class="mono muted">OEM ' + esc(p.oem) + '</div></td>' +
        '<td>' + stockBadge(p) + '<div class="muted" style="font-size:12px;margin-top:4px;white-space:nowrap">Mag. ' + p.stock['Magasin'] + ' · Rés. ' + p.stock['Réserve'] + ' · <span class="mono" style="font-size:12px">' + esc(p.loc['Magasin']) + '</span></div></td>' +
        (seeCost() ? '<td class="right num muted">' + fmt(p.cost) + '</td>' : '') +
        '<td class="right num"><b>' + fmt(p.prices[T.L]) + '</b></td>' +
        '<td class="right">' + (off ? (p.stock['Réserve'] > 0 ? '<button class="btn" type="button" data-action="modalTransfer" data-arg="' + p.id + '">Transférer</button>' : '<a class="btn" href="#/pieces/' + p.id + '">Équivalences</a>') : '<button class="btn btn-primary" type="button" data-action="caisseAdd" data-arg="' + p.id + '" aria-label="Ajouter ' + esc(p.brand + ' ' + p.ref) + '">Ajouter</button>') + '</td></tr>';
    }).join('') : '<tr><td colspan="6" class="empty">Aucune pièce. Essayez la référence OEM ou une autre marque.</td></tr>') +
    '</tbody></table></div></div></section>';

  let right;
  if (st.done) {
    const d = doc(st.done);
    right = '<div class="card-pad" style="padding:22px 20px;gap:16px"><div style="display:flex;gap:12px;align-items:center"><span class="avatar" style="background:var(--ok-bg)">' + ic('check', 24, '#15803D') + '</span><div><div style="font-weight:700;font-size:18px">Vente encaissée</div><div class="muted">Facture ' + d.ref + ' · ' + fmt(d.ttc) + '</div></div></div>' +
      '<ol class="steps"><li>Facture créée (réf. externe ' + esc(d.saleRef) + ')</li><li>Facture validée : stock sorti du Magasin</li><li>Paiement ' + esc(d.mode) + ' enregistré en Caisse' + (d.rendu ? ', rendu ' + fmt(d.rendu) : '') + '</li></ol>' +
      '<div class="actions"><button class="btn btn-outline" type="button" data-action="toast" data-arg="Ticket envoyé à l’imprimante (maquette)">Imprimer le ticket</button><a class="btn btn-outline" href="#/ventes/' + d.ref + '">Voir la facture</a></div>' +
      '<button class="btn btn-primary btn-lg" type="button" data-action="caisseNew">Nouvelle vente</button></div>';
  } else {
    const given = parseInt(String(st.given).replace(/\D/g, ''), 10) || 0, rendu = given - T.ttc;
    const blockFloor = T.below && !can(BELOW_FLOOR);
    const ok = st.lines.length > 0 && (st.mode !== 'especes' || rendu >= 0) && !blockFloor;
    const enc = encours(st.client);
    right = '<div style="padding:16px 18px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:10px">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline"><h2>Vente ' + st.ref + '</h2><span class="muted" style="font-size:13px">Entrepôt : Magasin</span></div>' +
      '<div class="field"><label for="caisse-client">Client</label><div style="display:flex;gap:8px"><select id="caisse-client" data-change="caisseClient" style="flex:1">' + S.db.clients.map((c) => '<option value="' + c.id + '"' + (c.id === st.client ? ' selected' : '') + '>' + esc(c.name) + ' — ' + c.cat + '</option>').join('') + '</select><a class="icon-btn" href="#/clients/nouveau" aria-label="Nouveau client">' + ic('plus') + '</a></div></div>' +
      '<div class="muted" style="font-size:13px">' + T.c.cat + ' → prix niveau ' + (T.L + 1) + ' (' + LEVELS[T.L] + ')' + (T.c.plafond ? ' · encours ' + fmt(enc) + ' / ' + fmt(T.c.plafond) : '') + '</div>' +
      (T.c.plafond && enc + T.ttc > T.c.plafond * 0.8 ? '<div class="alert a-warn" style="padding:8px 10px">' + ic('warn', 18, '#9A3412') + 'Après cette vente, l’encours atteindra ' + fmt(enc + T.ttc) + ' (plafond ' + fmt(T.c.plafond) + ').</div>' : '') +
      '</div>' +
      '<div style="padding:4px 18px">' + (st.lines.length ? T.lines.map((x, i) => '<div style="display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">' + esc(x.p.name) + '</div><div class="muted" style="font-size:12px">' + esc(x.p.brand + ' ' + x.p.ref) + ' · ' + fmt(x.unit) + ' HT' + (x.below ? ' · <span style="color:var(--bad);font-weight:600">sous le plancher</span>' : '') + '</div></div>' +
        '<div class="qty"><button type="button" data-action="caisseQty" data-arg="' + i + ':-1" aria-label="Diminuer">−</button><span class="num">' + x.l.qty + '</span><button type="button" data-action="caisseQty" data-arg="' + i + ':1" aria-label="Augmenter"' + (x.l.qty >= x.p.stock['Magasin'] ? ' disabled' : '') + '>+</button></div>' +
        '<span class="num right" style="width:96px;font-weight:600;font-size:14px">' + fmt(x.sum) + '</span></div>').join('') : '<p class="empty">Panier vide. Recherchez ou scannez une pièce.</p>') + '</div>' +
      '<div style="padding:12px 18px;display:flex;flex-direction:column;gap:6px;font-size:14px" class="num">' +
      '<div style="display:flex;justify-content:space-between;align-items:center"><label for="caisse-remise" class="muted">Remise %</label><input id="caisse-remise" class="input num" style="width:90px" inputmode="numeric" value="' + st.remise + '" data-input="caisseRemise"></div>' +
      '<div style="display:flex;justify-content:space-between"><span class="muted">Total HT</span><span>' + fmt(T.ht) + '</span></div>' +
      '<div style="display:flex;justify-content:space-between"><span class="muted">TVA 19 %</span><span>' + fmt(T.ttc - T.ht) + '</span></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line2);padding-top:6px"><b>Total TTC</b><span style="font-size:26px;font-weight:700">' + fmt(T.ttc) + '</span></div>' +
      (seeCost() ? '<div style="display:flex;justify-content:space-between;color:var(--ok)"><span>Marge estimée</span><span>' + fmt(T.ht - T.cost) + ' (' + (T.ht ? Math.round((T.ht - T.cost) / T.ht * 100) : 0) + ' %)</span></div>' : '') +
      (blockFloor ? '<div class="alert a-bad" style="padding:8px 10px">' + ic('warn', 18) + 'Remise sous le prix plancher : seul le gérant peut valider.</div>' : '') +
      '</div>' +
      '<div style="padding:12px 18px 18px;border-top:1px solid var(--line2);background:var(--soft);display:flex;flex-direction:column;gap:12px;border-radius:0 0 14px 14px">' +
      '<div role="group" aria-label="Mode de paiement" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px">' + [['especes', 'Espèces'], ['cheque', 'Chèque'], ['virement', 'Virement'], ['credit', 'À crédit']].map((m) => '<button type="button" class="chip" style="border-radius:10px;padding:0 4px" data-action="caisseMode" data-arg="' + m[0] + '" aria-pressed="' + (st.mode === m[0]) + '">' + m[1] + '</button>').join('') + '</div>' +
      (st.mode === 'especes' ? '<div style="display:flex;gap:10px;align-items:center"><label for="caisse-given" class="muted">Reçu</label><input id="caisse-given" class="input num" style="flex:1" inputmode="numeric" value="' + esc(st.given) + '" data-input="caisseGiven"><b class="num" style="color:' + (rendu >= 0 ? 'var(--ok)' : 'var(--bad)') + '">' + (rendu >= 0 ? 'Rendu ' + fmt(rendu) : 'Manque ' + fmt(-rendu)) + '</b></div>' : '') +
      (st.mode === 'credit' && st.client === 'c' ? '<div class="alert a-info" style="padding:8px 10px">' + ic('info', 18) + 'Choisissez un client pro pour une vente à crédit.</div>' : '') +
      '<button class="btn btn-primary btn-lg" type="button" data-action="caissePay"' + (ok && !(st.mode === 'credit' && st.client === 'c') ? '' : ' disabled') + '>' + (st.mode === 'credit' ? 'Valider la facture ' : 'Encaisser ') + fmt(T.ttc) + '</button></div>';
  }
  return head('Caisse', 'Vente comptoir', '<a class="btn" href="#/ventes/nouveau/devis">' + ic('plus', 18) + 'Devis</a><a class="btn" href="#/ventes" data-action="ventesTab" data-arg="facture">Factures</a>') +
    banner + '<div class="row">' + left + '<aside class="card" aria-label="Vente en cours" style="flex:1 1 380px;max-width:100%">' + right + '</aside></div>';
}

/* =================================================================== PIÈCES */
function viewPieces() {
  const f = S.ui.pf || (S.ui.pf = { q: '', fam: '', st: '' });
  let list = search(f.q, S.db.parts).filter((p) => (!f.fam || p.fam === f.fam) &&
    (!f.st || (f.st === 'alerte' ? total(p) < p.seuil : (f.st === 'rupture' ? total(p) === 0 : total(p) >= p.seuil))));
  return head('Pièces', S.db.parts.length + ' références · ' + S.db.parts.filter((p) => total(p) < p.seuil).length + ' sous le seuil d’alerte',
    (can(EDIT_PARTS) ? '<a class="btn btn-primary" href="#/pieces/nouveau">' + ic('plus', 18) + 'Nouvelle pièce</a>' : '') + (can(['gerant', 'comptable']) ? '<button class="btn" type="button" data-action="toast" data-arg="Export CSV généré (maquette)">Exporter</button>' : '')) +
    '<div class="toolbar"><label class="search" for="pf-q">' + ic('search', 20, '#4B5060') + '<span class="sr">Rechercher</span><input id="pf-q" type="search" placeholder="Référence, OEM, marque, EAN, désignation…" value="' + esc(f.q) + '" data-input="pfQ"></label>' +
    '<label class="sr" for="pf-fam">Famille</label><select id="pf-fam" data-change="pfFam"><option value="">Toutes les familles</option>' + FAMILIES.map((x) => '<option' + (x === f.fam ? ' selected' : '') + '>' + x + '</option>').join('') + '</select>' +
    '<label class="sr" for="pf-st">État du stock</label><select id="pf-st" data-change="pfSt"><option value="">Tous les stocks</option><option value="ok"' + (f.st === 'ok' ? ' selected' : '') + '>En stock</option><option value="alerte"' + (f.st === 'alerte' ? ' selected' : '') + '>Sous le seuil</option><option value="rupture"' + (f.st === 'rupture' ? ' selected' : '') + '>En rupture</option></select></div>' +
    '<div class="card" style="overflow:hidden"><div class="table-wrap"><table class="t" style="min-width:' + (seeCost() ? 1000 : 900) + 'px"><thead><tr><th>Pièce</th><th>Réf. / OEM</th><th>Famille</th><th>Empl.</th><th class="right">Magasin</th><th class="right">Réserve</th><th>État</th><th class="right">Public HT</th>' + (seeCost() ? '<th class="right">Coût PMP</th>' : '') + '</tr></thead><tbody>' +
    (list.length ? list.map((p) => '<tr class="click" data-action="go" data-arg="#/pieces/' + p.id + '"><td><div class="cellpart">' + thumb(p) + '<div><a class="rowlink" href="#/pieces/' + p.id + '">' + esc(p.name) + '</a><div class="t2">' + esc(p.brand) + '</div></div></div></td>' +
      '<td><div class="mono">' + esc(p.ref) + '</div><div class="mono muted">' + esc(p.oem) + '</div></td><td style="font-size:14px">' + esc(p.fam) + '</td><td class="mono">' + esc(p.loc['Magasin']) + '</td>' +
      '<td class="right num"><b>' + p.stock['Magasin'] + '</b></td><td class="right num">' + p.stock['Réserve'] + '</td><td>' + stockBadge(p) + '</td><td class="right num">' + fmt(p.prices[0]) + '</td>' +
      (seeCost() ? '<td class="right num muted">' + fmt(p.cost) + '</td>' : '') + '</tr>').join('') : '<tr><td colspan="9" class="empty">Aucune pièce ne correspond.</td></tr>') +
    '</tbody></table></div></div>';
}

function viewPiece(id) {
  const p = part(id);
  if (!p) return head('Pièce introuvable', '', '', ['#/pieces', 'Pièces']);
  const eq = S.db.parts.filter((x) => x.oem === p.oem);
  const moves = S.db.moves.filter((m) => m.pid === p.id).slice(0, 8);
  const photos = p.photos || [];
  return head(esc(p.name),
    '<span class="badge b-grey" style="background:var(--ink);color:#fff">' + esc(p.brand) + '</span> <span class="mono">Réf. ' + esc(p.ref) + '</span> · <span class="mono">OEM ' + esc(p.oem) + '</span> · <span class="mono">EAN ' + esc(p.ean) + '</span> · <span class="badge b-info">Type CARUNO : ' + esc(p.type) + '</span>',
    (can(['vendeur', 'responsable', 'gerant']) ? '<button class="btn btn-primary" type="button" data-action="caisseAddGo" data-arg="' + p.id + '">Ajouter à la vente</button>' : '') +
    '<button class="btn" type="button" data-action="modalLabel" data-arg="' + p.id + '">Étiquette</button>' +
    (can(EDIT_PARTS) ? '<a class="btn btn-outline" href="#/pieces/' + p.id + '/modifier">Modifier</a>' : ''), ['#/pieces', 'Pièces · ' + p.fam]) +
    '<div class="row">' +
    '<section class="card card-pad" aria-label="Photos" style="flex:1 1 340px;max-width:100%">' +
      '<div class="big-photo">' + (photos[0] ? '<img alt="Photo principale de la pièce" src="' + photos[0].url + '">' : ic('camera', 44, '#8A8F9C') + '<span>Aucune photo</span>') + '</div>' +
      '<div class="photos">' + photoTiles(photos, 'piecePhoto:' + p.id) + photoAdd('photoPiece', String(p.id)) + '</div>' +
      '<span class="muted" style="font-size:13px">Sur téléphone, « Ajouter » ouvre l’appareil photo. Chaque photo est réduite avant l’envoi.</span>' +
    '</section>' +
    '<div style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:18px">' +
      '<div class="grid-auto">' +
        '<section class="card card-pad"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Stock</h2>' + stockBadge(p) + '</div>' +
          WAREHOUSES.map((w) => '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2)"><div><b>' + w + '</b><div class="mono muted">' + esc(p.loc[w]) + '</div></div><span style="font-size:24px;font-weight:700" class="num">' + p.stock[w] + '</span></div>').join('') +
          '<span class="muted" style="font-size:13px">Seuil d’alerte ' + p.seuil + ' · stock souhaité ' + p.souhaite + '</span>' +
          (can(['magasinier', 'responsable', 'gerant']) ? '<div class="actions"><button class="btn btn-outline" type="button" data-action="modalTransfer" data-arg="' + p.id + '" style="flex:1">Transférer</button><button class="btn" type="button" data-action="modalCorrect" data-arg="' + p.id + '" style="flex:1">Corriger</button></div>' : '') +
        '</section>' +
        '<section class="card card-pad"><h2>Prix de vente</h2><table class="t"><thead><tr><th>Niveau</th><th class="right">HT</th><th class="right">TTC</th></tr></thead><tbody>' +
          LEVELS.map((l, i) => '<tr><td>' + (i + 1) + ' · ' + l + '</td><td class="right num">' + fmt(p.prices[i]) + '</td><td class="right num"><b>' + fmt(ttc(p.prices[i])) + '</b></td></tr>').join('') + '</tbody></table>' +
          '<span class="muted" style="font-size:13px">Prix plancher ' + fmt(p.floor) + ' HT · TVA ' + p.tva + ' %</span>' +
          (seeCost() ? '<div class="alert a-ok" style="flex-direction:column;gap:4px"><div style="display:flex;justify-content:space-between;width:100%"><span>Coût moyen (PMP)</span><b>' + fmt(p.cost) + '</b></div><div style="display:flex;justify-content:space-between;width:100%"><span>Marges</span><span>' + p.prices.map((x) => Math.round((x - p.cost) / x * 100) + ' %').join(' · ') + '</span></div></div>' : '<span class="muted" style="font-size:13px">Coût et marge masqués pour votre rôle.</span>') +
        '</section>' +
      '</div>' +
      '<section class="card" style="overflow:hidden"><div class="card-head"><h2>Équivalences</h2><span class="muted" style="font-size:14px">même OEM <span class="mono" style="color:var(--ink)">' + esc(p.oem) + '</span></span></div><div class="table-wrap"><table class="t" style="min-width:620px"><thead><tr><th>Marque</th><th>Référence</th><th>Stock</th><th class="right">Public HT</th><th></th></tr></thead><tbody>' +
        eq.map((x) => '<tr><td><b>' + esc(x.brand) + '</b></td><td class="mono">' + esc(x.ref) + '</td><td>' + stockBadge(x) + '</td><td class="right num">' + fmt(x.prices[0]) + '</td><td class="right">' + (x.id === p.id ? '<span class="muted" style="font-size:13px">Cette pièce</span>' : '<a href="#/pieces/' + x.id + '">Voir</a>') + '</td></tr>').join('') +
      '</tbody></table></div></section>' +
      (seeCost() ? '<section class="card" style="overflow:hidden"><div class="card-head"><h2>Fournisseurs</h2></div><div class="table-wrap"><table class="t" style="min-width:560px"><thead><tr><th>Fournisseur</th><th>Réf. fournisseur</th><th class="right">Achat HT</th><th class="right">Délai</th></tr></thead><tbody>' +
        p.sups.map((s) => '<tr><td><b>' + esc(supplier(s.sid).name) + '</b></td><td class="mono">' + esc(s.ref) + '</td><td class="right num">' + fmt(s.price) + '</td><td class="right">' + s.delay + ' j</td></tr>').join('') + '</tbody></table></div></section>' : '') +
      '<section class="card" style="overflow:hidden"><div class="card-head"><h2>Mouvements récents</h2>' + (can(['magasinier', 'comptable', 'responsable', 'gerant']) ? '<a href="#/stock" data-action="stockTabGo" data-arg="mouvements">Tous les mouvements</a>' : '') + '</div><div class="table-wrap"><table class="t" style="min-width:640px"><tbody>' +
        (moves.length ? moves.map((m) => '<tr><td class="muted num">' + dateFr(m.date.slice(0, 10)) + ' ' + m.date.slice(11) + '</td><td>' + esc(m.label) + '</td><td class="num" style="font-weight:700;color:' + (m.qty < 0 ? 'var(--bad)' : 'var(--ok)') + '">' + (m.qty > 0 ? '+' : '−') + Math.abs(m.qty) + '</td><td>' + m.wh + '</td><td class="mono muted">' + m.user + '</td></tr>').join('') : '<tr><td class="empty">Aucun mouvement.</td></tr>') +
      '</tbody></table></div></section>' +
    '</div></div>';
}
function photoTiles(photos, actionArg) {
  return photos.map((ph, i) => '<div class="photo' + (i === 0 ? ' main' : '') + '"><img alt="Photo ' + (i + 1) + '" src="' + ph.url + '">' + (i === 0 ? '<span class="tag">Principale</span>' : '') +
    '<div class="ops">' + (i ? '<button type="button" data-action="photoMain" data-arg="' + actionArg + ':' + i + '">Principale</button>' : '') + '<button type="button" data-action="photoDel" data-arg="' + actionArg + ':' + i + '">Supprimer</button></div></div>').join('');
}
function photoAdd(change, arg) {
  return '<label class="photo photo-add">' + ic('camera', 22) + '<span>Ajouter</span><input type="file" accept="image/*" capture="environment" multiple data-change="' + change + '" data-arg="' + arg + '" aria-label="Ajouter des photos"></label>';
}

function viewPieceForm(id) {
  const p = id ? part(id) : null;

  if (p) {

    if (sc.mode === 'consult') card += '<div class="grid-auto" style="grid-template-columns:repeat(2,1fr);gap:8px">' + WAREHOUSES.map((w) => '<div style="padding:10px 12px;border-radius:10px;background:var(--bg);display:flex;justify-content:space-between;align-items:baseline"><span class="muted">' + w + '</span><b style="font-size:20px">' + p.stock[w] + '</b></div>').join('') + '</div>' +
      '<div class="actions"><a class="btn btn-outline" href="#/pieces/' + p.id + '" style="flex:1">Fiche et photos</a>' + (can(['vendeur', 'responsable', 'gerant']) ? '<button class="btn btn-primary" type="button" data-action="caisseAddGo" data-arg="' + p.id + '" style="flex:1">Vendre</button>' : '<button class="btn" type="button" data-action="modalTransfer" data-arg="' + p.id + '" style="flex:1">Transférer</button>') + '</div>';
    if (sc.mode === 'count') { const n = sc.count === '' ? p.stock['Magasin'] : Number(sc.count); const gap = n - p.stock['Magasin'];
      card += '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="muted" style="font-size:14px">Compté en <b style="color:var(--ink)">Magasin</b><br>Attendu : ' + p.stock['Magasin'] + '</span><div class="qty"><button type="button" data-action="scanCount" data-arg="-1" aria-label="Moins un">−</button><span class="num" style="font-size:20px">' + n + '</span><button type="button" data-action="scanCount" data-arg="1" aria-label="Plus un">+</button></div></div>' +
        '<b style="color:' + (gap ? 'var(--warn)' : 'var(--ok)') + ';font-size:14px">' + (gap ? 'Écart ' + (gap > 0 ? '+' : '−') + Math.abs(gap) + ' : une correction sera créée' : 'Conforme') + '</b><button class="btn btn-primary btn-lg" type="button" data-action="scanSaveCount">Enregistrer le comptage</button>'; }
    if (sc.mode === 'reception') { const line = openPO && openPO.lines.find((l) => l.pid === p.id);
      card += line ? '<div class="alert a-ok">' + ic('check', 18) + 'Ligne cochée sur ' + openPO.ref + ' : ' + line.rec + ' / ' + line.qty + ' reçues</div><a class="btn btn-dark btn-lg" href="#/achats/' + openPO.ref + '">Voir la réception</a>' : '<div class="alert a-warn">' + ic('warn', 18, '#9A3412') + 'Pièce absente de la commande en cours.</div>'; }
    card += '</section>';
  }
  return head('Scanner', 'Caméra du téléphone ou douchette USB') +
    '<div style="max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px">' +
    '<div class="chips" role="group" aria-label="Mode">' + [['consult', 'Consulter'], ['count', 'Inventaire'], ['reception', 'Réception']].map((m) => '<button class="chip" type="button" data-action="scanMode" data-arg="' + m[0] + '" aria-pressed="' + (sc.mode === m[0]) + '">' + m[1] + '</button>').join('') + '</div>' +
    '<div class="cam"><span class="hint">' + (p ? 'Code lu : ' + esc(p.ean) : 'Placez le code-barres dans le cadre') + '</span><div class="frame"><div class="beam' + (p ? ' ok' : '') + '"></div></div><button class="btn" type="button" data-action="scanSim" style="position:absolute;bottom:14px;border-radius:999px">Simuler un scan</button></div>' +
    '<label class="search" for="scan-code">' + ic('scanner', 20, '#4B5060') + '<span class="sr">Code-barres</span><input id="scan-code" inputmode="numeric" placeholder="Saisir ou scanner un code, puis Entrée" value="' + esc(sc.code) + '" data-input="scanCode" data-enter="scanEnter"></label>' +
    card + '</div>';
}

/* =================================================================== TABLEAU DE BORD */
function viewTableau() {
  const day = S.db.day;
  const ca = day.base + (day.extra || 0);
  const imp = S.db.clients.reduce((t, c) => t + encours(c.id), 0);
  const lateClients = S.db.clients.filter((c) => S.db.docs.some((d) => d.client === c.id && d.type === 'facture' && d.status !== 'payee' && d.due && d.due < TODAY)).length;
  const alerts = S.db.parts.filter((p) => total(p) < p.seuil);
  const pending = S.db.docs.find((d) => d.pendingSale && d.status !== 'payee');
  const sellers = Object.keys(day.sellers).map((k) => ({ u: S.db.users.find((x) => x.login === k), v: day.sellers[k] })).sort((a, b) => b.v[0] - a.v[0]);
  const max = Math.max.apply(null, sellers.map((s) => s.v[0]));
  const tile = (l, v, s) => '<div class="card kpi"><span class="l">' + l + '</span><span class="v num">' + v + '</span><span class="s">' + s + '</span></div>';
  return head('Tableau de bord', 'Dimanche 1<sup>er</sup> novembre 2026 · montants TTC') +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">' +
      tile('Chiffre d’affaires du jour', fmt(ca), day.count + ' ventes · panier moyen ' + fmt(ca / day.count)) +
      tile('Octobre 2026', fmt(3412600), '+8 % par rapport à septembre') +
      (seeCost() ? tile('Marge brute d’octobre', '27,4 %', 'sur le coût moyen pondéré (PMP)') : '') +
      tile('Impayés clients', fmt(imp), lateClients + ' client(s) avec des factures en retard') +
    '</div>' +
    '<div class="grid-auto">' +
      '<section class="card card-pad"><h2>Ventes du jour par vendeur</h2>' + sellers.map((s) => '<div title="' + esc(s.u.name + ' : ' + fmt(s.v[0]) + ' en ' + s.v[1] + ' ventes') + '" style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;font-size:14px"><b>' + esc(s.u.name) + '</b><span class="num">' + fmt(s.v[0]) + ' <span class="muted">· ' + s.v[1] + ' ventes</span></span></div><div style="height:12px;background:#F0F0EC;border-radius:4px" aria-hidden="true"><div style="height:12px;width:' + Math.round(s.v[0] / max * 100) + '%;background:var(--accent);border-radius:0 4px 4px 0"></div></div></div>').join('') + '</section>' +
      '<section class="card card-pad"><h2>Point de caisse</h2><table class="t num"><thead><tr><th>Mode</th><th class="right">Encaissé</th></tr></thead><tbody><tr><td>Espèces</td><td class="right">' + fmt(day.cash) + '</td></tr><tr><td>Chèques</td><td class="right">' + fmt(day.cheque) + '</td></tr><tr><td>Virements</td><td class="right">' + fmt(day.virement) + '</td></tr><tr><td><b>Total</b></td><td class="right"><b>' + fmt(day.cash + day.cheque + day.virement) + '</b></td></tr></tbody></table>' +
        '<div class="alert a-info">Espèces attendues en caisse : <b>' + fmt(day.cash + 10000) + '</b> (fond de caisse 10 000 DA inclus)</div><button class="btn btn-dark" type="button" data-action="modalCashClose">Compter et clôturer la caisse</button></section>' +
      '<section class="card card-pad"><h2>À vérifier</h2>' +
        (pending ? '<div class="alert a-warn">' + ic('warn', 20, '#9A3412') + '<div><b>Attention :</b> vente ' + pending.pendingSale + ' interrompue, encaissement en attente (' + pending.ref + ', ' + fmt(pending.ttc - pending.paid) + '). <a href="#/ventes/' + pending.ref + '">Voir</a></div></div>' : '<div class="alert a-ok">' + ic('check', 20) + 'Aucune vente interrompue.</div>') +
        (day.orphans ? '<div class="alert" style="background:var(--bg)">' + ic('info', 20) + '<div style="display:flex;flex-direction:column;gap:8px"><span><b>Info :</b> ' + day.orphans + ' factures brouillon CARUNO de plus de 24 h, sans vente en cours. Sans effet sur le stock.</span><button class="btn btn-outline" type="button" data-action="cleanOrphans" style="align-self:flex-start">Examiner et supprimer</button></div></div>' : '') +
        '<div class="alert a-warn">' + ic('warn', 20, '#9A3412') + '<div>' + alerts.length + ' pièces sous le seuil d’alerte. <a href="#/stock">Voir le stock</a></div></div>' +
      '</section>' +
    '</div>';
}

}
function renderModal() {
  const m = S.ui.modal;
  if (!m) return '';
  const cancel = '<button class="btn" type="button" data-action="closeModal">Annuler</button>';
  if (m.kind === 'transfer') { const p = part(m.pid);
    return modal('Transférer ' + esc(p.brand + ' ' + p.ref), '<div class="form-grid"><div class="field"><label for="m-from">De</label><select id="m-from" name="from"><option' + (p.stock['Magasin'] === 0 ? '' : ' selected') + '>Magasin</option><option' + (p.stock['Magasin'] === 0 ? ' selected' : '') + '>Réserve</option></select></div><div class="field"><label for="m-qty">Quantité</label><input class="input num" id="m-qty" name="qty" inputmode="numeric" value="1"></div></div><span class="muted" style="font-size:14px">Stock actuel : Magasin ' + p.stock['Magasin'] + ' · Réserve ' + p.stock['Réserve'] + '</span>', cancel + '<button class="btn btn-primary" type="submit">Transférer</button>', 'mTransfer'); }
  if (m.kind === 'correct') { const p = part(m.pid);
    return modal('Corriger le stock', '<div class="form-grid"><div class="field"><label for="m-wh">Entrepôt</label><select id="m-wh" name="wh">' + WAREHOUSES.map((w) => '<option>' + w + '</option>').join('') + '</select></div><div class="field"><label for="m-real">Quantité réelle</label><input class="input num" id="m-real" name="real" inputmode="numeric" value="' + p.stock['Magasin'] + '"></div></div><div class="field"><label for="m-why">Motif</label><select id="m-why" name="why"><option>Inventaire</option><option>Casse</option><option>Perte</option><option>Erreur de saisie</option></select></div>', cancel + '<button class="btn btn-primary" type="submit">Corriger</button>', 'mCorrect'); }
  if (m.kind === 'label') { const p = part(m.pid);
    return modal('Étiquette', '<div class="label-prev"><b style="font-size:14px">' + esc(p.name) + '</b><span class="mono">' + esc(p.brand + ' ' + p.ref) + '</span><div class="bars" aria-hidden="true"></div><span class="mono" style="text-align:center;letter-spacing:.2em">' + esc(p.ean) + '</span><b class="num" style="font-size:18px">' + fmt(ttc(p.prices[0])) + ' TTC</b><span class="mono muted">' + esc(p.loc['Magasin']) + '</span></div><div class="field"><label for="m-n">Nombre d’étiquettes</label><input class="input num" id="m-n" value="' + p.stock['Magasin'] + '" inputmode="numeric" style="width:120px"></div>', cancel + '<button class="btn btn-primary" type="button" data-action="toast" data-arg="Étiquettes envoyées à l’imprimante (maquette)">Imprimer</button>'); }
  if (m.kind === 'pay') { const d = doc(m.ref);
    return modal('Encaisser ' + d.ref, '<div class="form-grid"><div class="field"><label for="m-amt">Montant</label><input class="input num" id="m-amt" name="amount" inputmode="numeric" value="' + (d.ttc - d.paid) + '"></div><div class="field"><label for="m-mode">Mode</label><select id="m-mode" name="mode"><option>Espèces</option><option>Chèque</option><option>Virement</option></select></div></div><span class="muted" style="font-size:14px">Reste dû : ' + fmt(d.ttc - d.paid) + '. Le reste est relu juste avant l’envoi : jamais de double paiement.</span>', cancel + '<button class="btn btn-primary" type="submit">Encaisser</button>', 'mPay'); }
  if (m.kind === 'settle') { const c = client(m.cid); const amount = Number(m.amount) || 0; const alloc = allocate(c.id, amount);
    return modal('Règlement — ' + esc(c.name), '<div class="form-grid"><div class="field"><label for="m-samt">Montant reçu</label><input class="input num" id="m-samt" inputmode="numeric" value="' + esc(m.amount) + '" data-input="settleAmount"></div><div class="field"><label for="m-smode">Mode</label><select id="m-smode" name="mode"><option>Chèque</option><option>Espèces</option><option>Virement</option></select></div></div>' +
      '<table class="t num"><thead><tr><th>Facture (plus ancienne d’abord)</th><th class="right">Affecté</th><th class="right">Reste</th></tr></thead><tbody>' + alloc.map((a) => '<tr><td class="mono">' + a.d.ref + '</td><td class="right">' + fmt(a.take) + '</td><td class="right">' + (a.left ? fmt(a.left) : '<b style="color:var(--ok)">Soldée</b>') + '</td></tr>').join('') + '</tbody></table>', cancel + '<button class="btn btn-primary" type="submit"' + (amount ? '' : ' disabled') + '>Enregistrer le règlement</button>', 'mSettle'); }
  if (m.kind === 'supplier') return modal('Nouveau fournisseur', '<div class="field"><label for="m-sn">Nom *</label><input class="input" id="m-sn" name="name" required></div><div class="form-grid"><div class="field"><label for="m-st">Ville</label><input class="input" id="m-st" name="town"></div><div class="field"><label for="m-sp">Téléphone</label><input class="input" id="m-sp" name="phone"></div></div><div class="field"><label for="m-se">E-mail</label><input class="input" id="m-se" name="email"></div>', cancel + '<button class="btn btn-primary" type="submit">Créer</button>', 'mSupplier');
  if (m.kind === 'cash') { const exp = S.db.day.cash + 10000;
    return modal('Clôture de caisse', '<div class="field"><label for="m-cnt">Espèces comptées</label><input class="input num" id="m-cnt" inputmode="numeric" value="' + esc(m.counted) + '" data-input="cashCount"></div><dl class="kv num"><dt>Attendu</dt><dd>' + fmt(exp) + '</dd><dt>Écart</dt><dd style="font-weight:700;color:' + ((Number(m.counted) || 0) - exp ? 'var(--bad)' : 'var(--ok)') + '">' + fmt((Number(m.counted) || 0) - exp) + '</dd></dl>', cancel + '<button class="btn btn-primary" type="button" data-action="cashClose">Clôturer</button>'); }
  return '';
}
function allocate(cid, amount) {
  let left = amount;
  return S.db.docs.filter((d) => d.type === 'facture' && d.client === cid && d.status !== 'payee' && d.status !== 'brouillon').sort((a, b) => a.date < b.date ? -1 : 1)
    .map((d) => { const due = d.ttc - d.paid; const take = Math.max(0, Math.min(due, left)); left -= take; return { d, take, left: due - take }; }).filter((a) => a.take > 0);
}

/* =================================================================== ROUTER & RENDER */
function route() {
  const h = (location.hash || '').replace(/^#\/?/, '');
  const [path, query] = h.split('?');
  return { parts: path.split('/').filter(Boolean), query };
}
function render() {
  const a = document.activeElement, focusId = a && a.id, sel = a && typeof a.selectionStart === 'number' ? a.selectionStart : null;
  const app = document.getElementById('app');
  if (!S.user) { app.innerHTML = viewLogin(); return; }
  const r = route(), p = r.parts, sec = p[0] || HOME[role()];
  if (!p[0]) { location.replace('#/' + sec); return; }
  const navItem = NAV.find((n) => n.id === sec);
  let html;

function addToCart(pid) {

  else if (p.stock['Magasin'] > 0) st.lines.push({ pid: p.id, qty: 1 });
  else toast('Aucun stock en Magasin pour ' + p.brand + ' ' + p.ref + '.');
}
function scanCode(code) {
  const sc = S.ui.scan, p = S.db.parts.find((x) => x.ean === String(code).trim());

}

    S.ui.formKey = ''; save(); toast(id ? 'Client enregistré.' : 'Client ' + c.name + ' créé.'); go('#/clients/' + c.id);
  },
  saveUser: () => { const f = S.ui.form; if (S.db.users.some((u) => u.login === f.login)) { toast('Cet identifiant existe déjà.'); return; } S.db.users.push({ login: f.login, name: f.name, role: f.role, email: f.email, active: true }); S.ui.formKey = ''; save(); toast('Utilisateur ' + f.login + ' créé. Mot de passe provisoire : ' + Math.random().toString(36).slice(2, 10)); go('#/utilisateurs'); },
  transfer: () => { const f = S.ui.form; const p = part(f.pid), q = Number(f.qty) || 0; if (f.from === f.to) { toast('Choisissez deux entrepôts différents.'); return; } if (q <= 0 || q > p.stock[f.from]) { toast('Quantité impossible : ' + p.stock[f.from] + ' en ' + f.from + '.'); return; } move(p.id, 'Transfert ' + f.from + ' → ' + f.to, -q, f.from); move(p.id, 'Transfert ' + f.from + ' → ' + f.to, q, f.to); save(); toast(q + ' × ' + p.brand + ' ' + p.ref + ' transféré(s) vers ' + f.to + '.'); },
  changePw: (form) => { form.reset(); toast('Mot de passe modifié (maquette).'); },
  mTransfer: (form, fd) => { const p = part(S.ui.modal.pid), from = fd.get('from'), to = from === 'Magasin' ? 'Réserve' : 'Magasin', q = Number(fd.get('qty')) || 0; if (q <= 0 || q > p.stock[from]) { toast('Quantité impossible : ' + p.stock[from] + ' en ' + from + '.'); return; } move(p.id, 'Transfert ' + from + ' → ' + to, -q, from); move(p.id, 'Transfert ' + from + ' → ' + to, q, to); S.ui.modal = null; save(); toast(q + ' transféré(s) vers ' + to + '.'); },
  mCorrect: (form, fd) => { const p = part(S.ui.modal.pid), wh = fd.get('wh'), real = Number(fd.get('real')) || 0, gap = real - p.stock[wh]; if (gap) move(p.id, 'Correction : ' + fd.get('why'), gap, wh); S.ui.modal = null; save(); toast(gap ? 'Stock corrigé (' + (gap > 0 ? '+' : '') + gap + ').' : 'Aucun écart.'); },
  mPay: (form, fd) => { const d = doc(S.ui.modal.ref), amt = Math.min(Number(fd.get('amount')) || 0, d.ttc - d.paid); if (amt <= 0) return; d.paid += amt; d.status = d.paid >= d.ttc ? 'payee' : 'partielle'; d.payments = (d.payments || []).concat([{ date: TODAY, mode: fd.get('mode'), amount: amt }]); S.ui.modal = null; save(); toast(fmt(amt) + ' encaissés sur ' + d.ref + '.'); },
  mSettle: (form, fd) => { const m = S.ui.modal; const alloc = allocate(m.cid, Number(m.amount) || 0); alloc.forEach((a) => { a.d.paid += a.take; a.d.status = a.d.paid >= a.d.ttc ? 'payee' : 'partielle'; a.d.payments = (a.d.payments || []).concat([{ date: TODAY, mode: fd.get('mode'), amount: a.take }]); }); S.ui.modal = null; save(); toast('Règlement de ' + fmt(Number(m.amount)) + ' réparti sur ' + alloc.length + ' facture(s).'); },
  mSupplier: (form, fd) => { S.db.suppliers.push({ id: 's' + Date.now().toString(36), name: fd.get('name'), town: fd.get('town'), phone: fd.get('phone'), email: fd.get('email') }); S.ui.modal = null; save(); toast('Fournisseur créé.'); }
};

function compress(file) {
  return new Promise((resolve) => {
    if (!file) return resolve(null);
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, 1280 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const url = c.toDataURL('image/jpeg', 0.72); resolve({ url, kb: Math.round(url.length * 0.75 / 1024) }); }; img.onerror = () => resolve(null); img.src = r.result; };
    r.onerror = () => resolve(null);
    r.readAsDataURL(file);
  });
}

/* =================================================================== EVENTS */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-action]');
  if (!el || !A[el.dataset.action]) return;
  // The modal backdrop closes only on a click on itself; clicks inside the dialog (submit buttons…) keep their default.
  if (el.dataset.action === 'closeModalBg') { if (ev.target === el) { S.ui.modal = null; render(); } return; }
  if (el.tagName === 'A' && el.dataset.action !== 'drawer') { A[el.dataset.action](el, ev); return; }
  if (el.tagName === 'TR' && ev.target.closest('a,button,input,select,label')) return;
  ev.preventDefault();
  if (A[el.dataset.action](el, ev) !== false) render();
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  const form = el.closest('[data-form]');
  if (form && el.name) { S.ui.form[el.name] = el.type === 'checkbox' ? el.checked : el.value; return; }
  if (el.dataset.input && I[el.dataset.input]) { if (I[el.dataset.input](el.value, el) !== false) render(); }
});
document.addEventListener('change', async (ev) => {
  const el = ev.target;
  const form = el.closest('[data-form]');
  if (form && el.name && el.tagName === 'SELECT') { S.ui.form[el.name] = el.value; return; }
  if (el.dataset.change && C[el.dataset.change]) { await C[el.dataset.change](el.value, el); render(); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && S.ui.modal) { S.ui.modal = null; render(); return; }
  const el = ev.target;
  if (ev.key === 'Enter' && el.dataset && el.dataset.enter && E[el.dataset.enter]) { ev.preventDefault(); E[el.dataset.enter](el); render(); }
});
document.addEventListener('submit', (ev) => {
  const form = ev.target.closest('[data-submit]');
  if (!form || !F[form.dataset.submit]) return;
  ev.preventDefault();
  F[form.dataset.submit](form, new FormData(form));
  render();
});
render();
</script>
